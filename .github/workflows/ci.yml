# Lint, Node 22 golden baselines, and slicc-kernel Node-entry integration.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: NOTICE covers every bundled package
        run: |
          set -euo pipefail
          # Build already regenerates NOTICE from esbuild metafiles; fail if any
          # node_modules package appears in meta without a NOTICE section.
          node -e '
            import { readFileSync } from "node:fs";
            import { packagesFromMetafiles } from "./scripts/generate-notice.mjs";
            const metas = ["dist/meta-main.json","dist/meta-stream.json","dist/meta-decoder.json"]
              .map((p) => JSON.parse(readFileSync(p, "utf8")));
            const pkgs = packagesFromMetafiles(metas);
            const notice = readFileSync("NOTICE", "utf8");
            const missing = [...pkgs.keys()].filter((n) => !notice.includes(`bundles ${n} `) && !notice.includes(`bundles ${n}\n`));
            // accept either "bundles name (" or "bundles name "
            const miss = [...pkgs.keys()].filter((n) => !notice.includes(n));
            if (miss.length) {
              console.error("NOTICE missing packages:", miss.join(", "));
              process.exit(1);
            }
            console.log("NOTICE ok:", pkgs.size, "packages");
          '
      - name: Lint
        run: npm run lint
      - name: Golden (host Node 22)
        timeout-minutes: 5
        run: npm run test:golden
      - name: jsh parity (host Node 22 baseline, kernel jsh)
        timeout-minutes: 5
        run: npm run test:jsh
      - name: Kernel integration (Node entry, memory root)
        # wasi-pnpm add -g cases (pnpm-global*.test.mjs) push this past 5m on GHA
        timeout-minutes: 10
        run: npm run test:integration
      - name: Cert (host Node 22 vs shim; kernel from plain dist)
        timeout-minutes: 10
        run: npm run test:cert
      - name: Node parallel slice (track pass/fail; non-strict)
        timeout-minutes: 5
        run: npm run test:node-parallel
      - name: Pack (files allowlist)
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/ai-ecoverse-slicc-jsh-*.tgz)
          node scripts/strip-pack-scripts.mjs "$tgz"
          echo "packed $tgz"
          tar -tzf "$tgz" | tee "$RUNNER_TEMP/listing.txt"
          node -e "const p=JSON.parse(require('child_process').execFileSync('tar',['-xOzf',process.argv[1],'package/package.json'],{encoding:'utf8'})); if(p.scripts?.prepare||p.scripts?.prepack){console.error('refuse: packed package.json still has prepare/prepack'); process.exit(1)}" "$tgz"
          if grep -E 'package/test/|package/scripts/' "$RUNNER_TEMP/listing.txt"; then
            echo "refuse: tarball ships test/ or scripts/" >&2
            exit 1
          fi
          test -n "$(grep 'package/dist/node.mjs' "$RUNNER_TEMP/listing.txt")"
          test -n "$(grep 'package/dist/jsh.mjs' "$RUNNER_TEMP/listing.txt")"
          test -n "$(grep 'package/NOTICE' "$RUNNER_TEMP/listing.txt")"
          test -n "$(grep 'package/dist/host/jsh.mjs' "$RUNNER_TEMP/listing.txt")"
          test -n "$(grep 'package/dist/host/main.mjs' "$RUNNER_TEMP/listing.txt")"
      - name: Host jsh from the tarball (global install, #!/usr/bin/env jsh)
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/global"
          npm install -g --prefix "$prefix" "$(ls "$RUNNER_TEMP"/ai-ecoverse-slicc-jsh-*.tgz)"
          export PATH="$prefix/bin:$PATH"
          jsh --version
          printf '#!/usr/bin/env jsh\nconsole.log(require("sliccy:fmt").col("ok", 4) + "|", process.argv.slice(2).join(","));\n' > "$RUNNER_TEMP/smoke.jsh"
          chmod +x "$RUNNER_TEMP/smoke.jsh"
          test "$("$RUNNER_TEMP/smoke.jsh" a b)" = "ok  | a,b"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/ai-ecoverse-slicc-jsh-*.tgz
          if-no-files-found: error
