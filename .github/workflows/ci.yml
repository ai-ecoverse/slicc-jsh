# Lint, Node 22 golden baselines, slicc-kernel Node-entry integration, and
# the curl | sh installer (install.sh) on Linux and macOS.
name: ci

# A pull request runs on pull_request, and the merge queue's commit (which
# becomes main's, merge method MERGE) on merge_group. A push runs nothing:
# a branch push repeated its PR's run, and main's push the queue's.
# workflow_dispatch runs it by hand on any ref.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The toolchain's Node, for every job (the baseline 22.22.0 stays pinned on
  # its own setup-node, renovate.json).
  # renovate: datasource=node-version depName=node versioning=node
  NODE_VERSION: '26.12.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Picks the runner for the Linux jobs (slicc-kernel's decider, kernel
  # ai-ecoverse/slicc-kernel#572): same-repo PR code and a merge group of
  # same-repo PRs go to the pool vars.CERT_RUNNER names (cloud-run-job: one
  # fresh Cloud Run Jobs execution per job), fork code to ubuntu-latest. It checks out nothing and
  # runs no PR code. vars.CI_RUNNER overrides it (rollback: ubuntu-latest);
  # vars.CERT_RUNNER names the pool. The decider itself is a few seconds of
  # work, so it runs hosted rather than paying the pool's cold start (about
  # 90 s on cloud-run-job), and a pool outage can't block it. macOS stays
  # hosted.
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          FORCED: ${{ vars.CI_RUNNER }}
          POOL: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
        with:
          script: |
            const hosted = 'ubuntu-latest';
            const pick = async (runner, why) => {
              core.setOutput('runner', runner);
              await core.summary.addRaw(`runner: ${runner} (${why})\n`).write();
            };
            if (process.env.FORCED) return await pick(process.env.FORCED, 'vars.CI_RUNNER');
            const pool = process.env.POOL;
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              const head = context.payload.pull_request.head.repo;
              const same = head && head.full_name === `${owner}/${repo}`;
              return same ? await pick(pool, 'same-repo PR') : await pick(hosted, 'fork PR');
            }
            if (context.eventName === 'merge_group') {
              const base = context.payload.merge_group.base_ref.replace('refs/heads/', '');
              const q = await github.graphql(
                `query($o:String!,$n:String!,$b:String!){repository(owner:$o,name:$n){mergeQueue(branch:$b){entries(first:100){nodes{pullRequest{number isCrossRepository}}}}}}`,
                { o: owner, n: repo, b: base }
              );
              const entries = q.repository.mergeQueue?.entries?.nodes ?? [];
              const forks = entries.filter((e) => e.pullRequest?.isCrossRepository !== false);
              return forks.length === 0
                ? await pick(pool, `merge group, ${entries.length} same-repo entries`)
                : await pick(hosted, `merge group with a fork or unknown PR: ${forks.map((e) => e.pullRequest?.number).join(', ')}`);
            }
            await pick(hosted, context.eventName);

  ci:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }}
    # The old bench pool ran the serial steps about 1.7x slower than hosted
    # (Golden 299 s vs 175 s, cert 188 s vs 86 s on the first pool run).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # The baselines' host Node 22.22.0 (scripts/node22.mjs reads $NODE22),
      # from the runner's tool cache rather than an npx fetch per run: a
      # stalled fetch once hung the golden step until its timeout.
      # Pinned on purpose (renovate.json): the goldens are recorded on 22.22.0,
      # and scripts/node22.mjs refuses any other version.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
      - name: Host Node 22 for the baselines
        timeout-minutes: 1
        run: |
          set -euo pipefail
          echo "NODE22=$(command -v node)" >> "$GITHUB_ENV"
          node --version
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: NOTICE covers every bundled package
        run: |
          set -euo pipefail
          # Build already regenerates NOTICE from esbuild metafiles; fail if any
          # node_modules package appears in meta without a NOTICE section.
          node -e '
            import { readdirSync, readFileSync } from "node:fs";
            import { packagesFromMetafiles } from "./scripts/generate-notice.mjs";
            const metas = readdirSync("dist")
              .filter((f) => /^meta-.*\.json$/.test(f))
              .map((f) => JSON.parse(readFileSync(`dist/${f}`, "utf8")));
            const pkgs = packagesFromMetafiles(metas);
            const notice = readFileSync("NOTICE", "utf8");
            const missing = [...pkgs.keys()].filter((n) => !notice.includes(`bundles ${n} `) && !notice.includes(`bundles ${n}\n`));
            // accept either "bundles name (" or "bundles name "
            const miss = [...pkgs.keys()].filter((n) => !notice.includes(n));
            if (miss.length) {
              console.error("NOTICE missing packages:", miss.join(", "));
              process.exit(1);
            }
            console.log("NOTICE ok:", pkgs.size, "packages");
          ' 2>&1 | tee "$RUNNER_TEMP/notice.out"
          grep -Eq '^NOTICE ok: [1-9][0-9]* packages$' "$RUNNER_TEMP/notice.out" || { echo "::error title=NOTICE: no verdict::the NOTICE check exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - name: Lint
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee "$RUNNER_TEMP/lint.out"
          grep -Eq '^lint ok$' "$RUNNER_TEMP/lint.out" || { echo "::error title=lint: no verdict::npm run lint exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      # Each kernel suite below runs in a session of its own (setsid), so a
      # signal to its process group can't reach the runner's step shell, and
      # under scripts/sigwho.pl, which logs who sent the group a SIGINT,
      # SIGTERM, SIGHUP or SIGQUIT (ai-ecoverse/slicc-jsh#250: a host SIGINT
      # ended the integration suite on the bench pool; cert-review isolates
      # its suites the same way since #247).
      - name: Suites in a session of their own
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/suite-signals.log"
          : > "$log"
          isolate=
          command -v setsid > /dev/null && isolate="setsid --wait"
          command -v perl > /dev/null && isolate="$isolate perl $GITHUB_WORKSPACE/scripts/sigwho.pl $log --"
          echo "ISOLATE=$isolate" >> "$GITHUB_ENV"
          echo "suites run under: ${isolate:-nothing (no setsid, no perl)}"
          # The check: a suite that signals its own group (kill(0)) ends
          # itself, not this shell, and the log names it.
          if [ -n "$isolate" ]; then
            rc=0
            $isolate sh -c 'kill -INT 0; sleep 5' || rc=$?
            echo "a kill(0, SIGINT) in the session: status $rc, and this shell goes on"
            test "$rc" = 130
            if command -v perl > /dev/null; then grep -q 'SIGINT from pid' "$log"; cat "$log"; : > "$log"; fi
          fi
      - name: Golden (host Node 22)
        timeout-minutes: 8
        # On the old bench pool (9 CPUs, shared with other jobs) six fixtures at
        # once, each a host Node and a kernel with its workers, starved them: node-options-node22's ~50 children
        # outlasted the 30 s shim limit, and the fixtures that compare timers
        # with I/O flipped (#241). Three at once there; hosted runners keep
        # golden.mjs's default (their CPU count, at most 6).
        env:
          GOLDEN_JOBS: ${{ needs.runner.outputs.runner != 'ubuntu-latest' && '3' || '' }}
        run: |
          set -euo pipefail
          $ISOLATE npm run test:golden 2>&1 | tee "$RUNNER_TEMP/golden.out"
          grep -Eq '^golden check: [1-9][0-9]* fixture\(s\)$' "$RUNNER_TEMP/golden.out" || { echo "::error title=golden: no verdict::npm run test:golden exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - name: jsh parity (host Node 22 baseline, kernel jsh)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          $ISOLATE npm run test:jsh 2>&1 | tee "$RUNNER_TEMP/jsh.out"
          grep -Eq '^jsh check: [1-9][0-9]* case\(s\)$' "$RUNNER_TEMP/jsh.out" || { echo "::error title=jsh parity: no verdict::npm run test:jsh exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - name: Kernel integration (Node entry, memory root)
        # wasi-pnpm add -g cases (pnpm-global*.test.mjs) push this past 5m on GHA
        timeout-minutes: 10
        run: |
          set -euo pipefail
          $ISOLATE npm run test:integration 2>&1 | tee "$RUNNER_TEMP/integration.out"
          { grep -Eq '^ℹ pass [1-9][0-9]*$' "$RUNNER_TEMP/integration.out" && grep -Eq '^ℹ fail 0$' "$RUNNER_TEMP/integration.out"; } || { echo "::error title=integration: no verdict::npm run test:integration exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - name: Cert (host Node 22 vs shim; kernel from plain dist)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          $ISOLATE npm run test:cert 2>&1 | tee "$RUNNER_TEMP/cert.out"
          grep -Eq '^cert: [1-9][0-9]* suite\(s\), [1-9][0-9]* case\(s\), failed=0$' "$RUNNER_TEMP/cert.out" || { echo "::error title=cert: no verdict::npm run test:cert exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - name: Node parallel slice (track pass/fail; non-strict)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          $ISOLATE npm run test:node-parallel 2>&1 | tee "$RUNNER_TEMP/node-parallel.out"
          grep -Eq '^totals: PASS=[1-9][0-9]* FAIL=[0-9]+ SKIP=[0-9]+ of [1-9][0-9]*$' "$RUNNER_TEMP/node-parallel.out" || { echo "::error title=node-parallel: no verdict::npm run test:node-parallel exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - name: Signals the suites' groups got (#250)
        if: always()
        run: cat "$RUNNER_TEMP/suite-signals.log" 2>/dev/null || true
      - name: Pack (files allowlist)
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/ai-ecoverse-slicc-jsh-*.tgz)
          # A plain npm pack must already be stripped (prepack runs
          # scripts/strip-own-scripts.mjs): that is what semantic-release's
          # npm publish ships to the registry.
          node -e "const p=JSON.parse(require('child_process').execFileSync('tar',['-xOzf',process.argv[1],'package/package.json'],{encoding:'utf8'})); if(p.scripts?.prepare||p.scripts?.prepack){console.error('refuse: packed package.json still has prepare/prepack'); process.exit(1)} console.log('packed package.json: no prepare or prepack')" "$tgz" 2>&1 | tee "$RUNNER_TEMP/prepack.out"
          grep -Eq '^packed package.json: no prepare or prepack$' "$RUNNER_TEMP/prepack.out" || { echo "::error title=pack: no verdict::the packed package.json check exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
          node scripts/strip-pack-scripts.mjs "$tgz"
          echo "packed $tgz"
          tar -tzf "$tgz" | tee "$RUNNER_TEMP/listing.txt"
          if grep -E 'package/test/|package/scripts/' "$RUNNER_TEMP/listing.txt"; then
            echo "refuse: tarball ships test/ or scripts/" >&2
            exit 1
          fi
          test -n "$(grep 'package/dist/node.mjs' "$RUNNER_TEMP/listing.txt")"
          test -n "$(grep 'package/dist/jsh.mjs' "$RUNNER_TEMP/listing.txt")"
          test -n "$(grep 'package/NOTICE' "$RUNNER_TEMP/listing.txt")"
          test -n "$(grep 'package/dist/host/jsh.mjs' "$RUNNER_TEMP/listing.txt")"
          test -n "$(grep 'package/dist/host/main.mjs' "$RUNNER_TEMP/listing.txt")"
          if grep -E 'package/install\.sh' "$RUNNER_TEMP/listing.txt"; then
            echo "refuse: tarball ships install.sh" >&2
            exit 1
          fi
      - name: Host jsh from the tarball (global install, #!/usr/bin/env jsh)
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/global"
          npm install -g --prefix "$prefix" "$(ls "$RUNNER_TEMP"/ai-ecoverse-slicc-jsh-*.tgz)"
          export PATH="$prefix/bin:$PATH"
          jsh --version
          printf '#!/usr/bin/env jsh\nconsole.log(require("sliccy:fmt").col("ok", 4) + "|", process.argv.slice(2).join(","));\n' > "$RUNNER_TEMP/smoke.jsh"
          chmod +x "$RUNNER_TEMP/smoke.jsh"
          test "$("$RUNNER_TEMP/smoke.jsh" a b)" = "ok  | a,b"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/ai-ecoverse-slicc-jsh-*.tgz
          if-no-files-found: error

  install:
    # install.sh from this checkout, against the published package, in a
    # throwaway HOME: (a) with Node 22 (install an older version, a
    # #!/usr/bin/env jsh script, re-run upgrades), (b) no Node and no
    # terminal fails with the instructions, the "yes, download Node" path on
    # a pseudo-terminal (test/install/answer-tty.py), and (c) --uninstall.
    # About 20 s of work, so it runs hosted on both OSes, not on the pool.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh test/install/run.sh
      - name: install.sh (Node 22, no Node, pty, uninstall)
        run: |
          set -euo pipefail
          sh test/install/run.sh 2>&1 | tee "$RUNNER_TEMP/install.out"
          grep -Eq '^all install\.sh cases passed$' "$RUNNER_TEMP/install.out" || { echo "::error title=install.sh: no verdict::sh test/install/run.sh exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }

  browser:
    # The kernel in a Chromium tab (slicc-shared-web's harness), slicc-jsh and
    # @ai-ecoverse/sliccy-browser installed in it with pnpm add -g, and
    # sliccy:browser driving the harness browser through the kernel's CDP
    # facade (SLICC_CDP_URL); then the skills corpus that uses it. Each run
    # is compared with the host jsh on the same browser (#73). One Chromium
    # at a time, under 3 GB.
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Chrome for Testing (config.chrome, with slicc-cdp)
        # Chrome's system libraries need root: hosted runners have sudo, and
        # the pool's image ships them (no root there).
        run: |
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then
            npm run browser -- --with-deps
          else
            npm run browser
          fi
      - name: Browser suite
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm run test:browser 2>&1 | tee "$RUNNER_TEMP/browser.out"
          { grep -Eq '^ℹ pass [1-9][0-9]*$' "$RUNNER_TEMP/browser.out" && grep -Eq '^ℹ fail 0$' "$RUNNER_TEMP/browser.out"; } || { echo "::error title=browser: no verdict::npm run test:browser exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-artifacts
          path: artifacts/
          if-no-files-found: ignore

  cert:
    # cert-review (.github/workflows/cert-review.yml): the LLM review of a
    # same-repo pull request that changes shipped behaviour, and in a merge
    # group the code-only check that every pull request in it was certified.
    name: cert
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/cert-review.yml
    secrets: inherit
