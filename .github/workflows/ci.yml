# Lint, Node 22 golden baselines, slicc-kernel Node-entry integration, and
# the curl | sh installer (install.sh) on Linux and macOS.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/renovate/') }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The baselines' host Node 22.22.0 (scripts/node22.mjs reads $NODE22),
      # from the runner's tool cache rather than an npx fetch per run: a
      # stalled fetch once hung the golden step until its timeout.
      # Pinned on purpose (renovate.json): the goldens are recorded on 22.22.0,
      # and scripts/node22.mjs refuses any other version.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
      - name: Host Node 22 for the baselines
        timeout-minutes: 1
        run: |
          set -euo pipefail
          echo "NODE22=$(command -v node)" >> "$GITHUB_ENV"
          node --version
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: NOTICE covers every bundled package
        run: |
          set -euo pipefail
          # Build already regenerates NOTICE from esbuild metafiles; fail if any
          # node_modules package appears in meta without a NOTICE section.
          node -e '
            import { readdirSync, readFileSync } from "node:fs";
            import { packagesFromMetafiles } from "./scripts/generate-notice.mjs";
            const metas = readdirSync("dist")
              .filter((f) => /^meta-.*\.json$/.test(f))
              .map((f) => JSON.parse(readFileSync(`dist/${f}`, "utf8")));
            const pkgs = packagesFromMetafiles(metas);
            const notice = readFileSync("NOTICE", "utf8");
            const missing = [...pkgs.keys()].filter((n) => !notice.includes(`bundles ${n} `) && !notice.includes(`bundles ${n}\n`));
            // accept either "bundles name (" or "bundles name "
            const miss = [...pkgs.keys()].filter((n) => !notice.includes(n));
            if (miss.length) {
              console.error("NOTICE missing packages:", miss.join(", "));
              process.exit(1);
            }
            console.log("NOTICE ok:", pkgs.size, "packages");
          '
      - name: Lint
        run: npm run lint
      - name: Golden (host Node 22)
        timeout-minutes: 5
        run: npm run test:golden
      - name: jsh parity (host Node 22 baseline, kernel jsh)
        timeout-minutes: 5
        run: npm run test:jsh
      - name: Kernel integration (Node entry, memory root)
        # wasi-pnpm add -g cases (pnpm-global*.test.mjs) push this past 5m on GHA
        timeout-minutes: 10
        run: npm run test:integration
      - name: Cert (host Node 22 vs shim; kernel from plain dist)
        timeout-minutes: 10
        run: npm run test:cert
      - name: Node parallel slice (track pass/fail; non-strict)
        timeout-minutes: 5
        run: npm run test:node-parallel
      - name: Pack (files allowlist)
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/ai-ecoverse-slicc-jsh-*.tgz)
          # A plain npm pack must already be stripped (prepack runs
          # scripts/strip-own-scripts.mjs): that is what semantic-release's
          # npm publish ships to the registry.
          node -e "const p=JSON.parse(require('child_process').execFileSync('tar',['-xOzf',process.argv[1],'package/package.json'],{encoding:'utf8'})); if(p.scripts?.prepare||p.scripts?.prepack){console.error('refuse: packed package.json still has prepare/prepack'); process.exit(1)}" "$tgz"
          node scripts/strip-pack-scripts.mjs "$tgz"
          echo "packed $tgz"
          tar -tzf "$tgz" | tee "$RUNNER_TEMP/listing.txt"
          if grep -E 'package/test/|package/scripts/' "$RUNNER_TEMP/listing.txt"; then
            echo "refuse: tarball ships test/ or scripts/" >&2
            exit 1
          fi
          test -n "$(grep 'package/dist/node.mjs' "$RUNNER_TEMP/listing.txt")"
          test -n "$(grep 'package/dist/jsh.mjs' "$RUNNER_TEMP/listing.txt")"
          test -n "$(grep 'package/NOTICE' "$RUNNER_TEMP/listing.txt")"
          test -n "$(grep 'package/dist/host/jsh.mjs' "$RUNNER_TEMP/listing.txt")"
          test -n "$(grep 'package/dist/host/main.mjs' "$RUNNER_TEMP/listing.txt")"
          if grep -E 'package/install\.sh' "$RUNNER_TEMP/listing.txt"; then
            echo "refuse: tarball ships install.sh" >&2
            exit 1
          fi
      - name: Host jsh from the tarball (global install, #!/usr/bin/env jsh)
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/global"
          npm install -g --prefix "$prefix" "$(ls "$RUNNER_TEMP"/ai-ecoverse-slicc-jsh-*.tgz)"
          export PATH="$prefix/bin:$PATH"
          jsh --version
          printf '#!/usr/bin/env jsh\nconsole.log(require("sliccy:fmt").col("ok", 4) + "|", process.argv.slice(2).join(","));\n' > "$RUNNER_TEMP/smoke.jsh"
          chmod +x "$RUNNER_TEMP/smoke.jsh"
          test "$("$RUNNER_TEMP/smoke.jsh" a b)" = "ok  | a,b"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/ai-ecoverse-slicc-jsh-*.tgz
          if-no-files-found: error

  install:
    # install.sh from this checkout, against the published package, in a
    # throwaway HOME: (a) with Node 22 (install an older version, a
    # #!/usr/bin/env jsh script, re-run upgrades), (b) no Node and no
    # terminal fails with the instructions, the "yes, download Node" path on
    # a pseudo-terminal (test/install/answer-tty.py), and (c) --uninstall.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh test/install/run.sh
      - name: install.sh (Node 22, no Node, pty, uninstall)
        run: sh test/install/run.sh

  browser:
    # The kernel in a Chromium tab (slicc-shared-web's harness), slicc-jsh and
    # @ai-ecoverse/sliccy-browser installed in it with pnpm add -g, and
    # sliccy:browser driving the harness browser through the kernel's CDP
    # facade (SLICC_CDP_URL); then the skills corpus that uses it. Each run
    # is compared with the host jsh on the same browser (#73). One Chromium
    # at a time, under 3 GB.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Chromium
        run: npx playwright-core install --with-deps --no-shell chromium
      - name: Browser suite
        timeout-minutes: 10
        run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-artifacts
          path: artifacts/
          if-no-files-found: ignore
