name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
  statuses: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/pipeline.yml@v2.11.1
    secrets: inherit
    with:
      node-version: '26'
      test-glob: test/integration/*.test.mjs
      shards: 4
      timeout-minutes: 30
      review-timeout-minutes: 90
      review-prompt: |
        SLICC-JSH

        This repository is slicc-jsh (`@ai-ecoverse/slicc-jsh`): the Node.js 22-compatible `node` command and the `jsh` command for slicc-kernel (abi js), which seven (seven.sliccy.ai) runs in the browser, plus the host `jsh` CLI (`dist/host/jsh.mjs`) and `install.sh`. The README and docs/compatibility.md are the contract: read the sections the change touches first. `git diff origin/main...HEAD`, or `$RUNNER_TEMP/review/context/pr.diff`, is the change.

        There is no certification after you: once this pull request passes the merge queue, semantic-release publishes it to npm from `main`, and seven and slicc-bios pick that release up. Review it as the last check before it ships.

        Look for real defects, in this order:
        1. Node compatibility: the behaviour must match Node 22.22.0 (errors and their codes, event and callback order, exit codes, signals, stdio, `child_process`, `fs`, `net`, `http`, ESM and CJS loading), or be a gap the README and docs/compatibility.md name. A change that moves output away from Node is a regression even when a test was edited to match.
        2. Security: under the kernel's `users: enforce`, a program never reads, writes, chmods, removes or spawns what Linux would refuse it, never gets credentials it shouldn't, and secrets (sealed values, TLS keys, passphrases) never reach a program, an error or the console. `install.sh` verifies what it downloads and never writes outside `JSH_HOME`, `JSH_BIN_DIR` and the rc line it asks about.
        3. Data loss or corruption: writes, renames and removes in the kernel's file system, and what the host `jsh` does on the user's machine.
        4. Compatibility for consumers: `slicc.commands` and `slicc.binfmt` in `package.json`, `engines.slicc-kernel`, `files` shipping everything the entries load, `NOTICE` naming every bundled package, and the host `jsh` on Node 22 and later.
        5. Tests: every behaviour change has a golden in `test/golden/fixtures/` (recorded on host Node 22.22.0 with `npm run golden:record`), a `.jsh` case in `test/jsh/fixtures/`, or an integration test in `test/integration/`, and a fix's test fails without the fix. Confirm that for a fix: copy the changed tests or fixtures into `$RUNNER_TEMP/base`, build it and run them there.
        6. Repo rules: no new comments in code or YAML, no new `.md` files, no unit tests in git (`test/unit/` is ignored), and a conventional-commit title (`fix`, `feat` and `perf` release, the rest don't).

        Run `npm run build` in a tree before you read or run its `dist/`. Run one golden with `node scripts/golden.mjs check <fixture>`, one `.jsh` case with `node scripts/jsh-golden.mjs check <case>`, and one test file with `node --test --test-timeout=900000 --test-global-setup=node_modules/@ai-ecoverse/slicc-shared-web/harness/global.mjs test/integration/<file>.test.mjs`; the baselines fetch host Node 22.22.0 with `npx` on their own. The `browser-*` files need Chrome for Testing (`npm run browser`). The review browsers aren't used by this repository. Don't report style preferences, or anything you haven't confirmed in the code or by a run.

        Severity: deny for a confirmed P1 or P2: a security or secret exposure, data loss or corruption, a crash or a `node` or `jsh` that no longer starts in the kernel or on the host, a regression against Node in a common workflow (npm and pnpm packages, CLIs, servers, child processes) without a workaround, a behaviour change without its test, or a fix whose test passes without it. A narrow difference from Node with a workaround is P3: comment with a repro and approve. A problem in the kernel belongs to ai-ecoverse/slicc-kernel, one in seven's pins to ai-ecoverse/slicc-bios: open it there as an issue.
