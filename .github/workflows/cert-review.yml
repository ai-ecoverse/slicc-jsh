name: cert-review

on:
  workflow_call:

permissions:
  contents: read

env:
  # renovate: datasource=node-version depName=node versioning=node
  NODE_VERSION: '26.12.0'
  # renovate: datasource=npm depName=@anthropic-ai/claude-code
  CLAUDE_CODE_VERSION: '2.1.296'
  EVIDENCE_CHECK: |
    import { appendFileSync } from 'node:fs';
    const expect = JSON.parse(process.env.EVIDENCE_EXPECT || '{}');
    const prefix = process.env.EVIDENCE_PREFIX || '';
    const family = process.env.EVIDENCE_FAMILY || '';
    const strict = process.env.EVIDENCE_STRICT === 'true';
    const keys = (process.env.EVIDENCE_KEYS || '').split(' ').filter(Boolean);
    const hex = (d) => String(d || '').replace(/^sha256:/, '').toLowerCase();
    const base = `${process.env.GITHUB_API_URL || 'https://api.github.com'}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
    const get = async (url) => {
      const res = await fetch(url, { headers: { accept: 'application/vnd.github+json', authorization: `Bearer ${process.env.GH_TOKEN}` } });
      if (!res.ok) throw new Error(`${url}: ${res.status} ${res.statusText}`);
      return res.json();
    };
    const started = Date.parse((await get(base)).run_started_at);
    const listed = [];
    for (let page = 1; ; page++) {
      const body = await get(`${base}/artifacts?per_page=100&page=${page}`);
      listed.push(...body.artifacts);
      if (body.artifacts.length < 100) break;
    }
    const current = (a) => !(Date.parse(a.created_at) < started);
    const problems = [];
    const ids = [];
    const names = new Set();
    for (const key of keys.length ? keys : Object.keys(expect)) {
      const value = expect[key] ?? '';
      const name = `${prefix}${key}`;
      names.add(name);
      const same = listed.filter((a) => a.name === name);
      if (!value) {
        if (strict) problems.push(`${name}: its job reported no artifact`);
        continue;
      }
      const [id, digest] = value.split(' ');
      const others = same.filter((a) => String(a.id) !== id && current(a));
      if (others.length) problems.push(`${name}: the run has ${others.map((a) => `id ${a.id}`).join(', ')}, which its job did not upload`);
      if (id === 'none') continue;
      const mine = same.find((a) => String(a.id) === id);
      if (!mine) problems.push(`${name}: its job uploaded id ${id}, which the run does not have`);
      else if (!hex(digest) || hex(mine.digest) !== hex(digest)) problems.push(`${name}: its job uploaded digest ${hex(digest) || 'none'}, the run's id ${id} has ${hex(mine.digest) || 'none'}`);
      else ids.push(id);
    }
    if (family) for (const a of listed) if (a.name.startsWith(family) && !names.has(a.name)) problems.push(`${a.name} (id ${a.id}): no job of this run reported it`);
    if (problems.length) {
      for (const p of problems) console.log(`::error title=evidence::${p}`);
      console.log(`evidence: FAIL: ${problems.length} problem(s)`);
      process.exit(1);
    }
    if (process.env.GITHUB_OUTPUT) appendFileSync(process.env.GITHUB_OUTPUT, `ids=${ids.join(',')}\n`);
    console.log(`evidence: ${ids.length} artifact(s) by id: ${ids.join(', ') || 'none'}`);

jobs:
  guard:
    name: cert-review / self-guard
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CERT_LIGHT_RUNNER || vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      pull-requests: write
    outputs:
      status: ${{ steps.guard.outputs.status }}
      touched: ${{ steps.guard.outputs.touched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Changes to cert-review itself need the coordinator's approval on this exact head
        id: guard
        uses: ai-ecoverse/slicc-shared-web/.github/actions/cert-self-guard@f342d7cf558c817ce517bbbbc4cc46df6eac2f97
        with:
          paths: |
            .github/workflows/cert*.yml
            .github/workflows/ci.yml
            .github/workflows/release.yml
            scripts/cert-review/**
            scripts/release-line.mjs
            scripts/release-body.mjs
            scripts/release-outcome.mjs
            .releaserc.json
            test/cert-review/**
            test/fixtures/cert-review/**
            .github/actions/cert-self-guard/**

  scope:
    name: cert-review / scope
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      behaviour: ${{ steps.shipped.outputs.behaviour }}
      why: ${{ steps.shipped.outputs.why }}
      fork: ${{ steps.refs.outputs.fork }}
      head: ${{ steps.refs.outputs.head }}
      pr_head: ${{ steps.refs.outputs.pr_head }}
      base: ${{ steps.refs.outputs.base }}
      version: ${{ steps.refs.outputs.version }}
      prev: ${{ steps.refs.outputs.prev }}
      ready: ${{ steps.refs.outputs.ready }}
      head_sha256: ${{ steps.pack.outputs.head_sha256 }}
      base_sha256: ${{ steps.pack.outputs.base_sha256 }}
      pack_artifact: ${{ steps.pack-artifact.outputs.artifact-id && format('{0} {1}', steps.pack-artifact.outputs.artifact-id, steps.pack-artifact.outputs.artifact-digest) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The candidate and the pull request's head (the tools stay main's, at the base)
        env:
          N: ${{ github.event.pull_request.number }}
        run: git fetch -q origin "$GITHUB_SHA" "+refs/pull/$N/head:refs/remotes/pr/head"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The candidate (the pull request merged onto current main), its base (main), and whether it is a fork's
        id: refs
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          N: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          READY: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
        run: |
          set -euo pipefail
          candidate=$GITHUB_SHA
          base=$(git rev-parse "$candidate^1")
          {
            echo "head=$candidate"
            echo "pr_head=$HEAD_SHA"
            echo "base=$base"
            echo "fork=$FORK"
            echo "ready=$READY"
            echo "version=0.0.0-pr.$N"
            echo "prev=0.0.0-base.$N"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Shipped behaviour (a conservative path filter; package.json or the lock alone only when the build differs)
        id: shipped
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail
          node scripts/cert-review/shipped.mjs --base "$BASE" --head "$HEAD_SHA" --work "$RUNNER_TEMP/shipped" 2>&1 | tee "$RUNNER_TEMP/shipped.out"
          { grep -Eq '^shipped: (behaviour|not behaviour): .' "$RUNNER_TEMP/shipped.out" && grep -Eq '^behaviour=(true|false)$' "$GITHUB_OUTPUT"; } || { echo "::error title=scope: no verdict::shipped.mjs exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - name: Pack the candidate and the base, as the release packs
        id: pack
        if: steps.shipped.outputs.behaviour == 'true' && steps.refs.outputs.fork != 'true' && steps.refs.outputs.ready == 'true'
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          VERSION: ${{ steps.refs.outputs.version }}
          PREV: ${{ steps.refs.outputs.prev }}
        run: |
          set -euo pipefail
          node scripts/cert-review/pack.mjs --version "$VERSION" --ref "$HEAD_SHA" --out "$RUNNER_TEMP/pack/head" 2>&1 | tee "$RUNNER_TEMP/pack-head.out"
          grep -Eq '^pack: .* sha256=[0-9a-f]{64} ' "$RUNNER_TEMP/pack-head.out" || { echo "::error title=pack: no verdict::pack.mjs (the candidate) exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
          node scripts/cert-review/pack.mjs --version "$PREV" --ref "$BASE" --out "$RUNNER_TEMP/pack/base" 2>&1 | tee "$RUNNER_TEMP/pack-base.out"
          grep -Eq '^pack: .* sha256=[0-9a-f]{64} ' "$RUNNER_TEMP/pack-base.out" || { echo "::error title=pack: no verdict::pack.mjs (the base) exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
          echo "head_sha256=$(jq -r .sha256 "$RUNNER_TEMP/pack/head/pack.json")" >> "$GITHUB_OUTPUT"
          echo "base_sha256=$(jq -r .sha256 "$RUNNER_TEMP/pack/base/pack.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: pack-artifact
        if: steps.pack.outcome == 'success'
        with:
          name: cert-pack-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/pack/head/*.tgz
            ${{ runner.temp }}/pack/head/pack.json
            ${{ runner.temp }}/pack/base/*.tgz
            ${{ runner.temp }}/pack/base/pack.json
            ${{ runner.temp }}/shipped/shipped.json
          if-no-files-found: error

  plan:
    name: cert-review / plan
    needs: scope
    if: needs.scope.outputs.behaviour == 'true' && needs.scope.outputs.fork != 'true' && needs.scope.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan_artifact: ${{ steps.plan-artifact.outputs.artifact-id && format('{0} {1}', steps.plan-artifact.outputs.artifact-id, steps.plan-artifact.outputs.artifact-digest) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The candidate and the pull request's head (the tools stay main's, at the base)
        env:
          N: ${{ github.event.pull_request.number }}
        run: git fetch -q origin "$GITHUB_SHA" "+refs/pull/$N/head:refs/remotes/pr/head"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The delta and the plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.event.pull_request.number }}
          VERSION: ${{ needs.scope.outputs.version }}
          PREV: ${{ needs.scope.outputs.prev }}
          HEAD_SHA: ${{ needs.scope.outputs.head }}
          BASE: ${{ needs.scope.outputs.base }}
        run: |
          set -euo pipefail
          node scripts/cert-review/plan.mjs --pr "$N" --version "$VERSION" --prev "$PREV" --head "$HEAD_SHA" --base "$BASE" --out "$RUNNER_TEMP/plan" 2>&1 | tee "$RUNNER_TEMP/plan.out"
          grep -Eq '^plan: .* [0-9]+ commit\(s\), [0-9]+ PR\(s\), [0-9]+ file\(s\)$' "$RUNNER_TEMP/plan.out" || { echo "::error title=plan: no verdict::plan.mjs exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
          cat "$RUNNER_TEMP/plan/plan.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: plan-artifact
        with:
          name: cert-review-plan-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/plan/
          if-no-files-found: error

  bench:
    name: cert-review / ${{ matrix.part }} (kernel ${{ matrix.kernel }})
    needs: [scope, plan]
    if: always() && needs.scope.outputs.behaviour == 'true' && needs.scope.outputs.fork != 'true' && needs.plan.result == 'success'
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    outputs:
      suites-tag-new: ${{ steps.leg.outputs.suites-tag-new }}
      suites-neg-new: ${{ steps.leg.outputs.suites-neg-new }}
      fixtures-1-new: ${{ steps.leg.outputs.fixtures-1-new }}
      fixtures-2-new: ${{ steps.leg.outputs.fixtures-2-new }}
      suites-tag-dev: ${{ steps.leg.outputs.suites-tag-dev }}
      suites-neg-dev: ${{ steps.leg.outputs.suites-neg-dev }}
      fixtures-1-dev: ${{ steps.leg.outputs.fixtures-1-dev }}
      fixtures-2-dev: ${{ steps.leg.outputs.fixtures-2-dev }}
      suites-tag-186: ${{ steps.leg.outputs.suites-tag-186 }}
      suites-neg-186: ${{ steps.leg.outputs.suites-neg-186 }}
      fixtures-1-186: ${{ steps.leg.outputs.fixtures-1-186 }}
      fixtures-2-186: ${{ steps.leg.outputs.fixtures-2-186 }}
      suites-tag-floor: ${{ steps.leg.outputs.suites-tag-floor }}
      suites-neg-floor: ${{ steps.leg.outputs.suites-neg-floor }}
      fixtures-1-floor: ${{ steps.leg.outputs.fixtures-1-floor }}
      fixtures-2-floor: ${{ steps.leg.outputs.fixtures-2-floor }}
      browser-dev: ${{ steps.leg.outputs.browser-dev }}
    strategy:
      fail-fast: false
      matrix:
        kernel: [new, dev, '186', floor]
        part: [suites-tag, suites-neg, fixtures-1, fixtures-2]
        include:
          - kernel: dev
            part: browser
    env:
      VERSION: ${{ needs.scope.outputs.version }}
      PREV: ${{ needs.scope.outputs.prev }}
      HEAD_SHA: ${{ needs.scope.outputs.head }}
      BASE: ${{ needs.scope.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The candidate and the pull request's head (the tools stay main's, at the base)
        env:
          N: ${{ github.event.pull_request.number }}
        run: git fetch -q origin "$GITHUB_SHA" "+refs/pull/$N/head:refs/remotes/pr/head"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
      - name: Host Node 22 for the baselines
        run: |
          echo "NODE22=$(command -v node)" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/cert" >> "$GITHUB_ENV"
          node --version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The pack artifact, by the id and digest the scope job reported
        id: pack-evidence
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
          PACK: ${{ needs.scope.outputs.pack_artifact }}
        run: |
          set -euo pipefail
          EVIDENCE_EXPECT="$(jq -nc --arg k "cert-pack-$N" --arg v "$PACK" '{($k): $v}')" EVIDENCE_PREFIX="" EVIDENCE_FAMILY="" EVIDENCE_STRICT=true \
            node --input-type=module -e "$EVIDENCE_CHECK" 2>&1 | tee "$RUNNER_TEMP/evidence-pack.out"
          grep -Eq '^evidence: [0-9]+ artifact\(s\) by id: ' "$RUNNER_TEMP/evidence-pack.out" || { echo "::error title=evidence: no verdict::the evidence check exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.pack-evidence.outputs.ids != ''
        with:
          artifact-ids: ${{ steps.pack-evidence.outputs.ids }}
          path: ${{ runner.temp }}/pack
          merge-multiple: true
      - name: Stage the head's tarball, the base's dist and kernel ${{ matrix.kernel }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE" "$HEAD_SHA" > "$RUNNER_TEMP/touched.txt"
          node scripts/cert-review/stage.mjs --version "$VERSION" --prev "$PREV" --ref "$HEAD_SHA" --prev-ref "$BASE" --work "$WORK" --kernels "${{ matrix.kernel }}" \
            --tarball "$(ls "$RUNNER_TEMP"/pack/pack/head/*.tgz)" --prev-tarball "$(ls "$RUNNER_TEMP"/pack/pack/base/*.tgz)" 2>&1 | tee "$RUNNER_TEMP/stage.out"
          grep -Eq '^stage: .* kernels ' "$RUNNER_TEMP/stage.out" || { echo "::error title=stage: no verdict::stage.mjs exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - name: Suites on one tree (golden, jsh parity, integration, cert, node-parallel)
        if: startsWith(matrix.part, 'suites-')
        env:
          TREE: ${{ matrix.part == 'suites-tag' && 'tag' || 'neg' }}
        run: |
          set -euo pipefail
          $(command -v setsid > /dev/null && echo setsid --wait) node scripts/cert-review/suites.mjs --work "$WORK" --kernel "${{ matrix.kernel }}" --touched "$RUNNER_TEMP/touched.txt" --tree "$TREE" 2>&1 | tee "$RUNNER_TEMP/suites.out"
          grep -Eq "^(suites ${{ matrix.kernel }} $TREE: [1-9][0-9]* run\\(s\\) in runs-$TREE\\.json|suites: kernel ${{ matrix.kernel }} is .*: nothing to run)$" "$RUNNER_TEMP/suites.out" \
            || jq -e 'length > 0' "$WORK/suites/${{ matrix.kernel }}/runs-$TREE.json" > /dev/null 2>&1 \
            || { echo "::error title=suites: no verdict::suites.mjs exited 0 without its verdict line or its runs-$TREE.json: a gate's silence is not a pass"; exit 1; }
      - name: m-fixtures and rows against host Node 22.22.0 (one shard)
        if: startsWith(matrix.part, 'fixtures-')
        env:
          SHARD: ${{ matrix.part == 'fixtures-1' && '1/2' || '2/2' }}
        run: |
          set -euo pipefail
          $(command -v setsid > /dev/null && echo setsid --wait) node scripts/cert-review/mfixtures.mjs --work "$WORK" --kernel "${{ matrix.kernel }}" --shard "$SHARD" 2>&1 | tee "$RUNNER_TEMP/mfixtures.out"
          grep -Eq "^(mfixtures ${{ matrix.kernel }}: \\{.*\\}|mfixtures: kernel ${{ matrix.kernel }} is .*: nothing to run)$" "$RUNNER_TEMP/mfixtures.out" || { echo "::error title=m-fixtures: no verdict::mfixtures.mjs exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - name: Chrome for Testing (the head's config.chrome)
        if: matrix.part == 'browser'
        working-directory: ${{ env.WORK }}/tag
        run: |
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then
            npm run browser -- --with-deps
          else
            npm run browser
          fi
      - name: Browser suite on the head, and on the base's dist for the browser tests the delta touches
        if: matrix.part == 'browser'
        run: |
          set -euo pipefail
          $(command -v setsid > /dev/null && echo setsid --wait) node scripts/cert-review/suites.mjs --work "$WORK" --kernel "${{ matrix.kernel }}" --touched "$RUNNER_TEMP/touched.txt" --only browser --tree both 2>&1 | tee "$RUNNER_TEMP/suites.out"
          grep -Eq "^suites [^ ]+ \\([^)]*\\) browser\\.json: regression [0-9]+, fixed [0-9]+, both-fail [0-9]+, fail-new-only [0-9]+$" "$RUNNER_TEMP/suites.out" \
            || { echo "::error title=browser suite: no verdict::suites.mjs exited 0 without its browser.json verdict line: a gate's silence is not a pass"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: bench-artifact
        if: always()
        with:
          name: cert-bench-${{ github.event.pull_request.number }}-${{ matrix.part }}-${{ matrix.kernel }}
          path: |
            ${{ env.WORK }}/suites/
            ${{ env.WORK }}/fixtures/
            ${{ env.WORK }}/tag/artifacts/
          if-no-files-found: ignore
      - name: The evidence artifact's id and digest, for the review (it downloads only what the bench jobs report)
        id: leg
        if: always()
        env:
          KEY: ${{ matrix.part }}-${{ matrix.kernel }}
          ID: ${{ steps.bench-artifact.outputs.artifact-id }}
          DIGEST: ${{ steps.bench-artifact.outputs.artifact-digest }}
        run: echo "$KEY=${ID:-none} ${DIGEST:-none}" | tee -a "$GITHUB_OUTPUT"

  review:
    name: cert-review / review
    needs: [scope, plan, bench]
    if: always() && needs.scope.outputs.behaviour == 'true' && needs.scope.outputs.fork != 'true' && needs.plan.result == 'success' && needs.bench.result != 'cancelled' && needs.bench.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      issues: write
    outputs:
      verdict_artifact: ${{ steps.verdict-artifact.outputs.artifact-id && format('{0} {1}', steps.verdict-artifact.outputs.artifact-id, steps.verdict-artifact.outputs.artifact-digest) || '' }}
    env:
      VERSION: ${{ needs.scope.outputs.version }}
      PREV: ${{ needs.scope.outputs.prev }}
      HEAD_SHA: ${{ needs.scope.outputs.head }}
      BASE: ${{ needs.scope.outputs.base }}
      N: ${{ github.event.pull_request.number }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The candidate and the pull request's head (the tools stay main's, at the base)
        env:
          N: ${{ github.event.pull_request.number }}
        run: git fetch -q origin "$GITHUB_SHA" "+refs/pull/$N/head:refs/remotes/pr/head"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
      - name: Host Node 22, cert-run and the work dir
        run: |
          echo "NODE22=$(command -v node)" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/cert" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/cert-review" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/cert-review"
          printf '#!/bin/sh\nexec env -u AWS_BEARER_TOKEN_BEDROCK -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN "$@"\n' > "$RUNNER_TEMP/bin/cert-run"
          chmod +x "$RUNNER_TEMP/bin/cert-run"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The bench artifacts, exactly those the bench jobs reported, by id and digest
        id: bench-evidence
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
          BENCH: ${{ toJSON(needs.bench.outputs) }}
          STRICT: ${{ needs.bench.result == 'success' }}
          LEGS: suites-tag-new suites-neg-new fixtures-1-new fixtures-2-new suites-tag-dev suites-neg-dev fixtures-1-dev fixtures-2-dev suites-tag-186 suites-neg-186 fixtures-1-186 fixtures-2-186 suites-tag-floor suites-neg-floor fixtures-1-floor fixtures-2-floor browser-dev
        run: |
          set -euo pipefail
          EVIDENCE_EXPECT="$BENCH" EVIDENCE_KEYS="$LEGS" EVIDENCE_PREFIX="cert-bench-$N-" EVIDENCE_FAMILY="cert-bench-$N-" EVIDENCE_STRICT="$STRICT" \
            node --input-type=module -e "$EVIDENCE_CHECK" 2>&1 | tee "$RUNNER_TEMP/evidence-bench.out"
          grep -Eq '^evidence: [0-9]+ artifact\(s\) by id: ' "$RUNNER_TEMP/evidence-bench.out" || { echo "::error title=evidence: no verdict::the evidence check exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.bench-evidence.outputs.ids != ''
        with:
          artifact-ids: ${{ steps.bench-evidence.outputs.ids }}
          path: ${{ runner.temp }}/cert
          merge-multiple: true
      - name: The plan artifact, by the id and digest the plan job reported
        id: plan-evidence
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
          PLAN: ${{ needs.plan.outputs.plan_artifact }}
        run: |
          set -euo pipefail
          EVIDENCE_EXPECT="$(jq -nc --arg k "cert-review-plan-$N" --arg v "$PLAN" '{($k): $v}')" EVIDENCE_PREFIX="" EVIDENCE_FAMILY="" EVIDENCE_STRICT=true \
            node --input-type=module -e "$EVIDENCE_CHECK" 2>&1 | tee "$RUNNER_TEMP/evidence-plan.out"
          grep -Eq '^evidence: [0-9]+ artifact\(s\) by id: ' "$RUNNER_TEMP/evidence-plan.out" || { echo "::error title=evidence: no verdict::the evidence check exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.plan-evidence.outputs.ids != ''
        with:
          artifact-ids: ${{ steps.plan-evidence.outputs.ids }}
          path: ${{ runner.temp }}/cert/plan
          merge-multiple: true
      - name: The pack artifact, by the id and digest the scope job reported
        id: pack-evidence
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
          PACK: ${{ needs.scope.outputs.pack_artifact }}
        run: |
          set -euo pipefail
          EVIDENCE_EXPECT="$(jq -nc --arg k "cert-pack-$N" --arg v "$PACK" '{($k): $v}')" EVIDENCE_PREFIX="" EVIDENCE_FAMILY="" EVIDENCE_STRICT=true \
            node --input-type=module -e "$EVIDENCE_CHECK" 2>&1 | tee "$RUNNER_TEMP/evidence-pack.out"
          grep -Eq '^evidence: [0-9]+ artifact\(s\) by id: ' "$RUNNER_TEMP/evidence-pack.out" || { echo "::error title=evidence: no verdict::the evidence check exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.pack-evidence.outputs.ids != ''
        with:
          artifact-ids: ${{ steps.pack-evidence.outputs.ids }}
          path: ${{ runner.temp }}/pack
          merge-multiple: true
      - name: Stage the trees and every kernel (no secrets in this step)
        run: |
          set -euo pipefail
          node scripts/cert-review/stage.mjs --version "$VERSION" --prev "$PREV" --ref "$HEAD_SHA" --prev-ref "$BASE" --work "$WORK" \
            --tarball "$(ls "$RUNNER_TEMP"/pack/pack/head/*.tgz)" --prev-tarball "$(ls "$RUNNER_TEMP"/pack/pack/base/*.tgz)" 2>&1 | tee "$RUNNER_TEMP/stage.out"
          grep -Eq '^stage: .* kernels ' "$RUNNER_TEMP/stage.out" || { echo "::error title=stage: no verdict::stage.mjs exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
          kernels=$(jq -r '.kernels[].id' "$WORK/stage.json")
          [ -n "$kernels" ] || { echo "::error title=stage: no kernels::stage.json names no kernel: a gate's silence is not a pass"; exit 1; }
          for k in $kernels; do
            node scripts/cert-review/suites.mjs --work "$WORK" --kernel "$k" --merge 2>&1 | tee "$RUNNER_TEMP/merge-$k.out"
            grep -Eq "^suites $k \\(.*\\)( suites\\.json: regression [0-9]+, |: no runs to merge )" "$RUNNER_TEMP/merge-$k.out" || { echo "::error title=suites merge: no verdict::suites.mjs --merge exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
          done
          node scripts/cert-review/digest.mjs --work "$WORK" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The review instructions
        env:
          TOOLS: ${{ github.event.pull_request.base.sha }}
          SUBJECT: pull request #${{ github.event.pull_request.number }} (head ${{ needs.scope.outputs.pr_head }}, merged onto main as ${{ needs.scope.outputs.head }})
          BASE: main at ${{ needs.scope.outputs.base }}
        run: node scripts/cert-review/prompt.mjs > "$RUNNER_TEMP/review-prompt.txt"
      - name: Claude Code (pinned, installed before any secret is in the job's steps)
        run: |
          npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version
      - name: Review
        env:
          CLAUDE_CODE_USE_BEDROCK: '1'
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ vars.CERT_BEDROCK_MODEL || 'global.anthropic.claude-opus-5-5' }}
        run: |
          set -o pipefail
          claude -p --model "$MODEL" --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
            --dangerously-skip-permissions --max-turns 300 --output-format stream-json --verbose \
            < "$RUNNER_TEMP/review-prompt.txt" > "$RUNNER_TEMP/claude-execution-output.json"
          tail -1 "$RUNNER_TEMP/claude-execution-output.json" | jq -r '"review: \(.subtype // "?") in \(.num_turns // "?") turns, \((.duration_ms // 0) / 60000 | floor) min"'
          test -s "$RUNNER_TEMP/cert-review/verdict.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: verdict-artifact
        if: always()
        with:
          name: cert-review-verdict-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/cert-review/verdict.json
            ${{ runner.temp }}/cert-review/comment.md
          if-no-files-found: ignore
      - name: Evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/evidence/claude-turns.json" 2> /dev/null || true
          cp -r "$RUNNER_TEMP/cert-review" "$WORK/plan" "$RUNNER_TEMP/evidence/" 2> /dev/null || true
          cp "$WORK/stage.json" "$WORK/digest.md" "$RUNNER_TEMP/evidence/" 2> /dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cert-review-evidence-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore

  record:
    name: cert-review / record
    needs: [scope, plan, bench, review]
    if: always() && needs.scope.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository && (needs.scope.outputs.behaviour != 'true' || needs.scope.outputs.ready == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      verdict: ${{ steps.record.outputs.verdict }}
    env:
      N: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ needs.scope.outputs.pr_head }}
      CANDIDATE: ${{ needs.scope.outputs.head }}
      VERSION: ${{ needs.scope.outputs.version }}
      BEHAVIOUR: ${{ needs.scope.outputs.behaviour }}
      WHY: ${{ needs.scope.outputs.why }}
      PACKED: ${{ needs.scope.outputs.head_sha256 }}
      UPSTREAM: ${{ needs.bench.result == 'success' && needs.review.result || format('bench {0}', needs.bench.result) }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The verdict artifact, by the id and digest the review job reported
        id: verdict-evidence
        if: needs.scope.outputs.behaviour == 'true'
        continue-on-error: true
        env:
          N: ${{ github.event.pull_request.number }}
          VERDICT_ARTIFACT: ${{ needs.review.outputs.verdict_artifact }}
        run: |
          set -euo pipefail
          EVIDENCE_EXPECT="$(jq -nc --arg k "cert-review-verdict-$N" --arg v "$VERDICT_ARTIFACT" '{($k): $v}')" EVIDENCE_PREFIX="" EVIDENCE_FAMILY="" EVIDENCE_STRICT=false \
            node --input-type=module -e "$EVIDENCE_CHECK" 2>&1 | tee "$RUNNER_TEMP/evidence-verdict.out"
          grep -Eq '^evidence: [0-9]+ artifact\(s\) by id: ' "$RUNNER_TEMP/evidence-verdict.out" || { echo "::error title=evidence: no verdict::the evidence check exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.scope.outputs.behaviour == 'true' && steps.verdict-evidence.outputs.ids != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.verdict-evidence.outputs.ids }}
          path: ${{ runner.temp }}/cert-review
          merge-multiple: true
      - name: The pack artifact, by the id and digest the scope job reported
        id: pack-evidence
        if: needs.scope.outputs.behaviour == 'true'
        continue-on-error: true
        env:
          N: ${{ github.event.pull_request.number }}
          PACK: ${{ needs.scope.outputs.pack_artifact }}
        run: |
          set -euo pipefail
          EVIDENCE_EXPECT="$(jq -nc --arg k "cert-pack-$N" --arg v "$PACK" '{($k): $v}')" EVIDENCE_PREFIX="" EVIDENCE_FAMILY="" EVIDENCE_STRICT=false \
            node --input-type=module -e "$EVIDENCE_CHECK" 2>&1 | tee "$RUNNER_TEMP/evidence-pack.out"
          grep -Eq '^evidence: [0-9]+ artifact\(s\) by id: ' "$RUNNER_TEMP/evidence-pack.out" || { echo "::error title=evidence: no verdict::the evidence check exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.scope.outputs.behaviour == 'true' && steps.pack-evidence.outputs.ids != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.pack-evidence.outputs.ids }}
          path: ${{ runner.temp }}/pack
          merge-multiple: true
      - name: The line (this job's tools, main's at the pull request's base)
        id: record
        env:
          EVIDENCE: ${{ steps.verdict-evidence.outcome == 'success' && steps.pack-evidence.outcome == 'success' && 'success' || 'failure' }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/cert-review" "$RUNNER_TEMP/record"
          if [ "$BEHAVIOUR" != true ]; then
            case "$BEHAVIOUR:$WHY" in
              "false:not behaviour: "?*) ;;
              *)
                echo "::error title=record: no verdict::the scope gave no verdict (behaviour '$BEHAVIOUR', why '$WHY'): a gate's silence is not a pass"
                exit 1
                ;;
            esac
            line="$WHY"
            printf '%s\n' "$line" > "$RUNNER_TEMP/record/line.txt"
            printf '**Cert review: not needed.** %s\n\n```\n%s\n```\n' "$WHY" "$line" > "$RUNNER_TEMP/record/section.md"
            echo "verdict=not-behaviour" >> "$GITHUB_OUTPUT"
            echo "state=success" >> "$GITHUB_OUTPUT"
          elif [ "$EVIDENCE" != success ]; then
            echo "::error title=record: evidence::the verdict or pack artifact is not the one its job uploaded (the evidence steps above)"
            line="cert-ci: FAIL @ai-ecoverse/slicc-jsh PR #$N head $HEAD_SHA: the run's verdict or pack artifact is not the one its job uploaded ($RUN_URL)"
            printf '%s\n' "$line" > "$RUNNER_TEMP/record/line.txt"
            printf '**Cert review: evidence mismatch.** The verdict or pack artifact is not the one its job uploaded.\n\n```\n%s\n```\n' "$line" > "$RUNNER_TEMP/record/section.md"
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            echo "state=failure" >> "$GITHUB_OUTPUT"
          else
            tgz=$(ls "$RUNNER_TEMP"/pack/pack/head/*.tgz 2> /dev/null | head -1 || true)
            rc=0
            node scripts/cert-review/record.mjs --pr "$N" --head "$HEAD_SHA" --commit "$CANDIDATE" --version "$VERSION" --review "$RUNNER_TEMP/cert-review" \
              --out "$RUNNER_TEMP/record" --run "$RUN_URL" --repo "$GH_REPO" --tarball "$tgz" --sha256 "$PACKED" --upstream "$UPSTREAM" 2>&1 | tee "$RUNNER_TEMP/record.out" || rc=$?
            certified="^certified @ai-ecoverse/slicc-jsh PR #$N head $HEAD_SHA sha256=[0-9a-f]{64} "
            if [ "$rc" = 0 ] && grep -Eq "$certified" "$RUNNER_TEMP/record.out" && grep -Eq "$certified" "$RUNNER_TEMP/record/line.txt" 2> /dev/null; then
              echo "verdict=certified" >> "$GITHUB_OUTPUT"
              echo "state=success" >> "$GITHUB_OUTPUT"
            else
              if [ "$rc" = 0 ]; then
                echo "::error title=record: no verdict::record.mjs exited 0 without its certified line: a gate's silence is not a pass"
                line="cert-ci: FAIL @ai-ecoverse/slicc-jsh PR #$N head $HEAD_SHA: record.mjs exited 0 without its certified line ($RUN_URL)"
                printf '%s\n' "$line" > "$RUNNER_TEMP/record/line.txt"
                printf '**Cert review: no verdict.** record.mjs exited 0 without its certified line.\n\n```\n%s\n```\n' "$line" > "$RUNNER_TEMP/record/section.md"
              fi
              echo "verdict=fail" >> "$GITHUB_OUTPUT"
              echo "state=failure" >> "$GITHUB_OUTPUT"
            fi
          fi
          { echo '```'; cat "$RUNNER_TEMP/record/line.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cert-review-record-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/record/
          if-no-files-found: error
      - name: The cert-review status on the head, and the sticky comment on the pull request
        env:
          STATE: ${{ steps.record.outputs.state }}
        run: |
          line=$(head -1 "$RUNNER_TEMP/record/line.txt")
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state="$STATE" -f context=cert-review -f target_url="$RUN_URL" \
            -f description="$(printf '%s' "$line" | cut -c1-140)" --jq '"status \(.state) on \(.sha)"'
          body=$(printf '<!-- cert-review -->\n%s\n' "$(cat "$RUNNER_TEMP/record/section.md")")
          id=$(gh api "repos/$GH_REPO/issues/$N/comments" --paginate --jq '.[] | select(.body | startswith("<!-- cert-review -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" --jq .html_url
          else
            gh api "repos/$GH_REPO/issues/$N/comments" -f body="$body" --jq .html_url
          fi

  merge-group:
    name: cert-review / merge group
    if: github.event_name == 'merge_group'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CERT_LIGHT_RUNNER || vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.merge_group.base_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The group's commits (the tools are main's; base_sha may be the group ahead's speculative merge, so it is only the start of the group's commit range)
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: git fetch -q origin "+$HEAD_REF:refs/remotes/group/head"
      - name: Every pull request in the group has a successful cert-review on the head that entered the queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/cert-review/group.mjs --base "$BASE" --head "$HEAD_SHA" --repo "$GH_REPO" --run "$RUN_URL" 2>&1 | tee "$RUNNER_TEMP/group.out"
          grep -Eq '^group status: success: .' "$RUNNER_TEMP/group.out" || { echo "::error title=merge group: no verdict::group.mjs exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }

  verdict:
    name: cert-review / verdict
    needs: [guard, scope, record, merge-group]
    if: always()
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CERT_LIGHT_RUNNER || vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The required check
        env:
          EVENT: ${{ github.event_name }}
          FORK: ${{ needs.scope.outputs.fork }}
          BEHAVIOUR: ${{ needs.scope.outputs.behaviour }}
          WHY: ${{ needs.scope.outputs.why }}
          VERDICT: ${{ needs.record.outputs.verdict }}
          READY: ${{ needs.scope.outputs.ready }}
          SCOPE: ${{ needs.scope.result }}
          GROUP: ${{ needs.merge-group.result }}
          GUARD: ${{ needs.guard.result }}
          GUARD_STATUS: ${{ needs.guard.outputs.status }}
        run: |
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            echo "cert-review runs on pull requests and merge groups ($EVENT)"
            exit 0
          fi
          if [ "$GUARD" != success ]; then
            echo "::error title=cert-review self-guard::${GUARD_STATUS:-$GUARD}: a change to cert-review's own workflow, tools or fixtures needs the coordinator's cert-review-approved label on this exact head"
            exit 1
          fi
          if [ "$EVENT" = merge_group ]; then
            [ "$GROUP" = success ] || { echo "::error::a pull request in the group has no successful cert-review on the head that entered the queue"; exit 1; }
            echo "every pull request in the group is certified or not behaviour"
            exit 0
          fi
          [ "$SCOPE" = success ] || { echo "::error::cert-review could not decide the scope ($SCOPE)"; exit 1; }
          case "$BEHAVIOUR" in
            true | false) ;;
            *)
              echo "::error title=scope: no verdict::the scope job succeeded without a behaviour verdict ('$BEHAVIOUR'): a gate's silence is not a pass"
              exit 1
              ;;
          esac
          if [ "$FORK" = true ] && [ "$BEHAVIOUR" = true ]; then
            echo "::error title=fork: no cert review::a fork's pull request that changes shipped behaviour gets no review (no secrets); push the branch to this repository"
            exit 1
          fi
          if [ "$BEHAVIOUR" = false ]; then
            case "$WHY" in
              "not behaviour: "?*) ;;
              *)
                echo "::error title=scope: no verdict::not behaviour without its reason ('$WHY'): a gate's silence is not a pass"
                exit 1
                ;;
            esac
            [ "$FORK" = true ] || [ "$VERDICT" = not-behaviour ] || { echo "::error title=record: no verdict::the record job gave '$VERDICT', not not-behaviour: a gate's silence is not a pass"; exit 1; }
            echo "$WHY"
            exit 0
          fi
          if [ "$READY" != true ]; then
            echo "::error title=cert-review: draft, not reviewed::this pull request changes shipped behaviour ($WHY) and is a draft; mark it ready for review and the certifying review runs, and again on each later push"
            exit 1
          fi
          [ "$VERDICT" = certified ] || { echo "::error::cert-review: $VERDICT (see the record and the pull request comment)"; exit 1; }
          echo "certified"
