name: cert-review

on:
  workflow_call:
    inputs:
      version:
        description: 'The tagged, unpublished version to certify, x.y.z (tag v<version>)'
        required: true
        type: string
      tarball:
        description: 'The name of the artifact in this run that holds the packed tarball'
        required: true
        type: string
      sha256:
        description: "The pack job's sha256 of the tarball"
        required: true
        type: string
    outputs:
      verdict:
        description: 'certified or fail, from the record'
        value: ${{ jobs.record.outputs.verdict }}
      sha256:
        description: 'The sha256 record computed from the artifact, empty unless certified'
        value: ${{ jobs.record.outputs.sha256 }}
      line:
        description: 'The verdict line'
        value: ${{ jobs.record.outputs.line }}
  workflow_dispatch:
    inputs:
      version:
        description: 'The tagged version to replay, x.y.z (tag v<version>), packed again from its tag; a replay records only (no status, no release notes, the publish gate as a dry run)'
        required: true
        type: string
      prev:
        description: 'The certified version the delta is read from, x.y.z (empty: the newest earlier release body with a cert-review line)'
        required: false
        type: string

permissions:
  contents: read

env:
  # renovate: datasource=node-version depName=node versioning=node
  NODE_VERSION: '24.22.0'
  # renovate: datasource=npm depName=@anthropic-ai/claude-code
  CLAUDE_CODE_VERSION: '2.1.292'

jobs:
  plan:
    name: cert-review / plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.plan.outputs.go }}
      version: ${{ steps.plan.outputs.version }}
      prev: ${{ steps.plan.outputs.prev }}
      commit: ${{ steps.plan.outputs.commit }}
      mode: ${{ steps.plan.outputs.mode }}
      artifact: ${{ steps.plan.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: The version, the certified version before it, and the delta
        id: plan
        env:
          IN_TARBALL: ${{ inputs.tarball }}
          IN_VERSION: ${{ inputs.version }}
          IN_PREV: ${{ inputs.prev }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          version=$IN_VERSION prev=$IN_PREV
          [[ "$version" =~ $semver ]] || { echo "::error::version '$version' is not x.y.z"; exit 1; }
          [ -z "$prev" ] || [[ "$prev" =~ $semver ]] || { echo "::error::prev '$prev' is not x.y.z"; exit 1; }
          if [ -n "$IN_TARBALL" ]; then mode=release artifact=$IN_TARBALL; else mode=dispatch artifact="slicc-jsh-tarball-$version-replay"; fi
          git rev-parse -q --verify "refs/tags/v$version^{commit}" > /dev/null || { echo "::error::no tag v$version"; exit 1; }
          node scripts/cert-review/plan.mjs --version "$version" ${prev:+--prev "$prev"} --out "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan/plan.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "go=true"
            echo "version=$version"
            echo "prev=$(jq -r .prev "$RUNNER_TEMP/plan/plan.json")"
            echo "commit=$(jq -r .commit "$RUNNER_TEMP/plan/plan.json")"
            echo "mode=$mode"
            echo "artifact=$artifact"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cert-review-plan-${{ steps.plan.outputs.version }}
          path: ${{ runner.temp }}/plan/
          if-no-files-found: ignore

  pack:
    name: cert-review / pack (replay)
    needs: plan
    if: needs.plan.outputs.go == 'true' && needs.plan.outputs.mode == 'dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pack v${{ needs.plan.outputs.version }} from its tag, as the release does
        id: pack
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/cert-review/pack.mjs --version "$VERSION" --out "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: |
            ${{ runner.temp }}/pack/*.tgz
            ${{ runner.temp }}/pack/*.tgz.sha256
            ${{ runner.temp }}/pack/pack.json
          if-no-files-found: error

  bench:
    name: cert-review / ${{ matrix.part }} (kernel ${{ matrix.kernel }})
    needs: [plan, pack]
    if: always() && needs.plan.outputs.go == 'true' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled'

    runs-on: ${{ vars.CERT_RUNNER || 'cloud-run-bench' }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        kernel: [new, dev, '186', floor]
        part: [suites-tag, suites-neg, fixtures-1, fixtures-2]
        include:
          - kernel: dev
            part: browser
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PREV: ${{ needs.plan.outputs.prev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
      - name: Host Node 22 for the baselines
        run: |
          echo "NODE22=$(command -v node)" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/cert" >> "$GITHUB_ENV"
          node --version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/tarball

      - name: Stage the artifact, v${{ env.PREV }}'s dist and kernel ${{ matrix.kernel }}
        run: |
          git diff --name-only "v$PREV" "v$VERSION" > "$RUNNER_TEMP/touched.txt"
          node scripts/cert-review/stage.mjs --version "$VERSION" --prev "$PREV" --work "$WORK" --kernels "${{ matrix.kernel }}" --tarball "$(ls "$RUNNER_TEMP"/tarball/*.tgz)"

      - name: Suites on one tree (golden, jsh parity, integration, cert, node-parallel)
        if: startsWith(matrix.part, 'suites-')
        env:
          TREE: ${{ matrix.part == 'suites-tag' && 'tag' || 'neg' }}
        run: $(command -v setsid > /dev/null && echo setsid --wait) node scripts/cert-review/suites.mjs --work "$WORK" --kernel "${{ matrix.kernel }}" --touched "$RUNNER_TEMP/touched.txt" --tree "$TREE"

      - name: m-fixtures and rows against host Node 22.22.0 (one shard)
        if: startsWith(matrix.part, 'fixtures-')
        env:
          SHARD: ${{ matrix.part == 'fixtures-1' && '1/2' || '2/2' }}
        run: $(command -v setsid > /dev/null && echo setsid --wait) node scripts/cert-review/mfixtures.mjs --work "$WORK" --kernel "${{ matrix.kernel }}" --shard "$SHARD"

      - name: Chrome for Testing (the tag's config.chrome)
        if: matrix.part == 'browser'
        working-directory: ${{ env.WORK }}/tag
        run: |
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then
            npm run browser -- --with-deps
          else
            npm run browser
          fi
      - name: Browser suite on tag
        if: matrix.part == 'browser'
        run: $(command -v setsid > /dev/null && echo setsid --wait) node scripts/cert-review/suites.mjs --work "$WORK" --kernel "${{ matrix.kernel }}" --touched "$RUNNER_TEMP/touched.txt" --only browser --tree tag

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cert-bench-${{ env.VERSION }}-${{ matrix.part }}-${{ matrix.kernel }}
          path: |
            ${{ env.WORK }}/suites/
            ${{ env.WORK }}/fixtures/
            ${{ env.WORK }}/tag/artifacts/
          if-no-files-found: ignore

  review:
    name: cert-review / review
    needs: [plan, pack, bench]
    if: always() && needs.plan.outputs.go == 'true' && needs.bench.result != 'cancelled' && needs.bench.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: cert-review-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PREV: ${{ needs.plan.outputs.prev }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
      - name: Host Node 22, cert-run and the work dir
        run: |
          echo "NODE22=$(command -v node)" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/cert" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/cert-review" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/cert-review"
          printf '#!/bin/sh\nexec env -u AWS_BEARER_TOKEN_BEDROCK -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN "$@"\n' > "$RUNNER_TEMP/bin/cert-run"
          chmod +x "$RUNNER_TEMP/bin/cert-run"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cert-bench-${{ env.VERSION }}-*
          path: ${{ runner.temp }}/cert
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cert-review-plan-${{ env.VERSION }}
          path: ${{ runner.temp }}/cert/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/tarball

      - name: Stage the trees, every kernel and the rebuild (no secrets in this step)
        run: |
          node scripts/cert-review/stage.mjs --version "$VERSION" --prev "$PREV" --work "$WORK" --rebuild --tarball "$(ls "$RUNNER_TEMP"/tarball/*.tgz)"
          for k in $(jq -r '.kernels[].id' "$WORK/stage.json"); do node scripts/cert-review/suites.mjs --work "$WORK" --kernel "$k" --merge; done
          node scripts/cert-review/digest.mjs --work "$WORK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The review instructions
        env:
          TOOLS: ${{ github.sha }}
        run: node scripts/cert-review/prompt.mjs > "$RUNNER_TEMP/review-prompt.txt"

      - name: Claude Code (pinned, installed before any secret is in the job's steps)
        run: |
          npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version

      - name: Review
        id: review
        env:
          CLAUDE_CODE_USE_BEDROCK: '1'
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ vars.CERT_BEDROCK_MODEL || 'global.anthropic.claude-opus-5-5' }}
        run: |
          set -o pipefail
          claude -p --model "$MODEL" --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
            --dangerously-skip-permissions --max-turns 300 --output-format stream-json --verbose \
            < "$RUNNER_TEMP/review-prompt.txt" > "$RUNNER_TEMP/claude-execution-output.json"
          tail -1 "$RUNNER_TEMP/claude-execution-output.json" | jq -r '"review: \(.subtype // "?") in \(.num_turns // "?") turns, \((.duration_ms // 0) / 60000 | floor) min"'
          test -s "$RUNNER_TEMP/cert-review/verdict.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cert-review-verdict-${{ env.VERSION }}
          path: |
            ${{ runner.temp }}/cert-review/verdict.json
            ${{ runner.temp }}/cert-review/comment.md
          if-no-files-found: ignore

      - name: Evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/evidence/claude-turns.json" 2> /dev/null || true
          cp -r "$RUNNER_TEMP/cert-review" "$WORK/plan" "$RUNNER_TEMP/evidence/" 2> /dev/null || true
          cp "$WORK/stage.json" "$WORK/digest.md" "$RUNNER_TEMP/evidence/" 2> /dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cert-review-evidence-${{ env.VERSION }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore

  record:
    name: cert-review / record
    needs: [plan, pack, bench, review]
    if: always() && needs.plan.outputs.go == 'true' && needs.review.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cert-review-record-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      statuses: write
    outputs:
      verdict: ${{ steps.record.outputs.verdict }}
      sha256: ${{ steps.record.outputs.sha256 }}
      line: ${{ steps.record.outputs.line }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MODE: ${{ needs.plan.outputs.mode }}
      PLAN_COMMIT: ${{ needs.plan.outputs.commit }}
      PACKED: ${{ needs.plan.outputs.mode == 'release' && inputs.sha256 || needs.pack.outputs.sha256 }}
      UPSTREAM: ${{ needs.bench.result == 'success' && needs.review.result || format('bench {0}', needs.bench.result) }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: cert-review-verdict-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/cert-review

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/tarball

      - name: The line, from the artifact and the verdict (this job's tools, from ${{ github.sha }})
        id: record
        run: |
          mkdir -p "$RUNNER_TEMP/cert-review" "$RUNNER_TEMP/tarball"
          tgz=$(ls "$RUNNER_TEMP"/tarball/*.tgz 2> /dev/null | head -1 || true)
          replay=''
          [ "$MODE" = release ] || replay=--replay
          if node scripts/cert-review/record.mjs --version "$VERSION" --review "$RUNNER_TEMP/cert-review" \
            --out "$RUNNER_TEMP/record" --run "$RUN_URL" --repo "$GH_REPO" --tarball "$tgz" --sha256 "$PACKED" \
            --upstream "$UPSTREAM" $replay; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          fi
          commit=$(jq -r '.commit // empty' "$RUNNER_TEMP/record/record.json")
          echo "commit=${commit:-$PLAN_COMMIT}" >> "$GITHUB_OUTPUT"
          jq -r '"verdict=\(if .certified then "certified" else "fail" end)", "sha256=\(.sha256 // "")", "line=\(.line | split("\n")[0])"' \
            "$RUNNER_TEMP/record/record.json" >> "$GITHUB_OUTPUT"
          { echo '```'; cat "$RUNNER_TEMP/record/line.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: artifact
        with:
          name: cert-review-record-${{ needs.plan.outputs.version }}
          path: |
            ${{ runner.temp }}/record/record.json
            ${{ runner.temp }}/record/line.txt
            ${{ runner.temp }}/record/section.md
          if-no-files-found: error

      - name: The cert-review status on the release commit
        if: needs.plan.outputs.mode == 'release'
        env:
          CONCLUSION: ${{ steps.record.outputs.conclusion }}
          COMMIT: ${{ steps.record.outputs.commit }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          line=$(head -1 "$RUNNER_TEMP/record/line.txt")
          gh api "repos/$GH_REPO/statuses/$COMMIT" \
            -f state="$CONCLUSION" -f context=cert-review -f target_url="$RUN_URL/artifacts/$ARTIFACT" \
            -f description="$(printf '%s' "$line" | cut -c1-140)" \
            --jq '"status \(.id) \(.state) on \(.url)"'

      - name: The record's verdict is this job's result
        if: steps.record.outputs.conclusion != 'success'
        run: |
          echo "::error title=v$VERSION not certified::$(head -1 "$RUNNER_TEMP/record/line.txt")"
          exit 1

  gate:
    name: cert-review / publish gate (dry run)
    needs: [plan, pack, record]
    if: always() && needs.plan.outputs.mode == 'dispatch' && needs.pack.result == 'success' && needs.record.result != 'skipped' && needs.record.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/tarball
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cert-review-record-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/record
      - name: The publish job's gate and npm publish, as a dry run
        env:
          PACKED: ${{ needs.pack.outputs.sha256 }}
        run: |
          tgz=$(ls "$RUNNER_TEMP"/tarball/*.tgz)
          node scripts/cert-review/publish.mjs --dry-run --tarball "$tgz" --record "$RUNNER_TEMP/record/record.json" --sha256 "$PACKED"
