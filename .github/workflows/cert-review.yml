name: cert-review

on:
  workflow_call:

permissions:
  contents: read

env:
  # renovate: datasource=node-version depName=node versioning=node
  NODE_VERSION: '24.22.0'
  # renovate: datasource=npm depName=@anthropic-ai/claude-code
  CLAUDE_CODE_VERSION: '2.1.292'

jobs:
  scope:
    name: cert-review / scope
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && (vars.CERT_RUNNER || 'cloud-run-bench') || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      behaviour: ${{ steps.shipped.outputs.behaviour }}
      why: ${{ steps.shipped.outputs.why }}
      fork: ${{ steps.refs.outputs.fork }}
      head: ${{ steps.refs.outputs.head }}
      base: ${{ steps.refs.outputs.base }}
      version: ${{ steps.refs.outputs.version }}
      prev: ${{ steps.refs.outputs.prev }}
      head_sha256: ${{ steps.pack.outputs.head_sha256 }}
      base_sha256: ${{ steps.pack.outputs.base_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The pull request's head commit (the tools stay main's, at the base)
        env:
          N: ${{ github.event.pull_request.number }}
        run: git fetch -q origin "+refs/pull/$N/head:refs/remotes/pr/head"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The head, its merge base with main, and whether the pull request is a fork's
        id: refs
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          N: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE_REF"
          base=$(git merge-base FETCH_HEAD "$HEAD_SHA")
          {
            echo "head=$HEAD_SHA"
            echo "base=$base"
            echo "fork=$FORK"
            echo "version=0.0.0-pr.$N"
            echo "prev=0.0.0-base.$N"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Shipped behaviour (a conservative path filter; package.json or the lock alone only when the build differs)
        id: shipped
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: node scripts/cert-review/shipped.mjs --base "$BASE" --head "$HEAD_SHA" --work "$RUNNER_TEMP/shipped"
      - name: Pack the head and the base, as the release packs
        id: pack
        if: steps.shipped.outputs.behaviour == 'true' && steps.refs.outputs.fork != 'true'
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          VERSION: ${{ steps.refs.outputs.version }}
          PREV: ${{ steps.refs.outputs.prev }}
        run: |
          set -euo pipefail
          node scripts/cert-review/pack.mjs --version "$VERSION" --ref "$HEAD_SHA" --out "$RUNNER_TEMP/pack/head"
          node scripts/cert-review/pack.mjs --version "$PREV" --ref "$BASE" --out "$RUNNER_TEMP/pack/base"
          echo "head_sha256=$(jq -r .sha256 "$RUNNER_TEMP/pack/head/pack.json")" >> "$GITHUB_OUTPUT"
          echo "base_sha256=$(jq -r .sha256 "$RUNNER_TEMP/pack/base/pack.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.pack.outcome == 'success'
        with:
          name: cert-pack-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/pack/head/*.tgz
            ${{ runner.temp }}/pack/head/pack.json
            ${{ runner.temp }}/pack/base/*.tgz
            ${{ runner.temp }}/pack/base/pack.json
            ${{ runner.temp }}/shipped/shipped.json
          if-no-files-found: error

  plan:
    name: cert-review / plan
    needs: scope
    if: needs.scope.outputs.behaviour == 'true' && needs.scope.outputs.fork != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The pull request's head commit (the tools stay main's, at the base)
        env:
          N: ${{ github.event.pull_request.number }}
        run: git fetch -q origin "+refs/pull/$N/head:refs/remotes/pr/head"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The delta and the plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.event.pull_request.number }}
          VERSION: ${{ needs.scope.outputs.version }}
          PREV: ${{ needs.scope.outputs.prev }}
          HEAD_SHA: ${{ needs.scope.outputs.head }}
          BASE: ${{ needs.scope.outputs.base }}
        run: |
          node scripts/cert-review/plan.mjs --pr "$N" --version "$VERSION" --prev "$PREV" --head "$HEAD_SHA" --base "$BASE" --out "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan/plan.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cert-review-plan-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/plan/
          if-no-files-found: error

  bench:
    name: cert-review / ${{ matrix.part }} (kernel ${{ matrix.kernel }})
    needs: [scope, plan]
    if: always() && needs.scope.outputs.behaviour == 'true' && needs.scope.outputs.fork != 'true' && needs.plan.result == 'success'
    runs-on: ${{ vars.CERT_RUNNER || 'cloud-run-bench' }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        kernel: [new, dev, '186', floor]
        part: [suites-tag, suites-neg, fixtures-1, fixtures-2]
        include:
          - kernel: dev
            part: browser
    env:
      VERSION: ${{ needs.scope.outputs.version }}
      PREV: ${{ needs.scope.outputs.prev }}
      HEAD_SHA: ${{ needs.scope.outputs.head }}
      BASE: ${{ needs.scope.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The pull request's head commit (the tools stay main's, at the base)
        env:
          N: ${{ github.event.pull_request.number }}
        run: git fetch -q origin "+refs/pull/$N/head:refs/remotes/pr/head"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
      - name: Host Node 22 for the baselines
        run: |
          echo "NODE22=$(command -v node)" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/cert" >> "$GITHUB_ENV"
          node --version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cert-pack-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/pack
      - name: Stage the head's tarball, the base's dist and kernel ${{ matrix.kernel }}
        run: |
          git diff --name-only "$BASE" "$HEAD_SHA" > "$RUNNER_TEMP/touched.txt"
          node scripts/cert-review/stage.mjs --version "$VERSION" --prev "$PREV" --ref "$HEAD_SHA" --prev-ref "$BASE" --work "$WORK" --kernels "${{ matrix.kernel }}" \
            --tarball "$(ls "$RUNNER_TEMP"/pack/pack/head/*.tgz)" --prev-tarball "$(ls "$RUNNER_TEMP"/pack/pack/base/*.tgz)"
      - name: Suites on one tree (golden, jsh parity, integration, cert, node-parallel)
        if: startsWith(matrix.part, 'suites-')
        env:
          TREE: ${{ matrix.part == 'suites-tag' && 'tag' || 'neg' }}
        run: $(command -v setsid > /dev/null && echo setsid --wait) node scripts/cert-review/suites.mjs --work "$WORK" --kernel "${{ matrix.kernel }}" --touched "$RUNNER_TEMP/touched.txt" --tree "$TREE"
      - name: m-fixtures and rows against host Node 22.22.0 (one shard)
        if: startsWith(matrix.part, 'fixtures-')
        env:
          SHARD: ${{ matrix.part == 'fixtures-1' && '1/2' || '2/2' }}
        run: $(command -v setsid > /dev/null && echo setsid --wait) node scripts/cert-review/mfixtures.mjs --work "$WORK" --kernel "${{ matrix.kernel }}" --shard "$SHARD"
      - name: Chrome for Testing (the head's config.chrome)
        if: matrix.part == 'browser'
        working-directory: ${{ env.WORK }}/tag
        run: |
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then
            npm run browser -- --with-deps
          else
            npm run browser
          fi
      - name: Browser suite on the head
        if: matrix.part == 'browser'
        run: $(command -v setsid > /dev/null && echo setsid --wait) node scripts/cert-review/suites.mjs --work "$WORK" --kernel "${{ matrix.kernel }}" --touched "$RUNNER_TEMP/touched.txt" --only browser --tree tag
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cert-bench-${{ github.event.pull_request.number }}-${{ matrix.part }}-${{ matrix.kernel }}
          path: |
            ${{ env.WORK }}/suites/
            ${{ env.WORK }}/fixtures/
            ${{ env.WORK }}/tag/artifacts/
          if-no-files-found: ignore

  review:
    name: cert-review / review
    needs: [scope, plan, bench]
    if: always() && needs.scope.outputs.behaviour == 'true' && needs.scope.outputs.fork != 'true' && needs.plan.result == 'success' && needs.bench.result != 'cancelled' && needs.bench.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      VERSION: ${{ needs.scope.outputs.version }}
      PREV: ${{ needs.scope.outputs.prev }}
      HEAD_SHA: ${{ needs.scope.outputs.head }}
      BASE: ${{ needs.scope.outputs.base }}
      N: ${{ github.event.pull_request.number }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The pull request's head commit (the tools stay main's, at the base)
        env:
          N: ${{ github.event.pull_request.number }}
        run: git fetch -q origin "+refs/pull/$N/head:refs/remotes/pr/head"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
      - name: Host Node 22, cert-run and the work dir
        run: |
          echo "NODE22=$(command -v node)" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/cert" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/cert-review" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/cert-review"
          printf '#!/bin/sh\nexec env -u AWS_BEARER_TOKEN_BEDROCK -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN "$@"\n' > "$RUNNER_TEMP/bin/cert-run"
          chmod +x "$RUNNER_TEMP/bin/cert-run"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cert-bench-${{ github.event.pull_request.number }}-*
          path: ${{ runner.temp }}/cert
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cert-review-plan-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/cert/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cert-pack-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/pack
      - name: Stage the trees and every kernel (no secrets in this step)
        run: |
          node scripts/cert-review/stage.mjs --version "$VERSION" --prev "$PREV" --ref "$HEAD_SHA" --prev-ref "$BASE" --work "$WORK" \
            --tarball "$(ls "$RUNNER_TEMP"/pack/pack/head/*.tgz)" --prev-tarball "$(ls "$RUNNER_TEMP"/pack/pack/base/*.tgz)"
          for k in $(jq -r '.kernels[].id' "$WORK/stage.json"); do node scripts/cert-review/suites.mjs --work "$WORK" --kernel "$k" --merge; done
          node scripts/cert-review/digest.mjs --work "$WORK" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The review instructions
        env:
          TOOLS: ${{ github.event.pull_request.base.sha }}
          SUBJECT: pull request #${{ github.event.pull_request.number }} (head ${{ needs.scope.outputs.head }})
          BASE: main at ${{ needs.scope.outputs.base }}
        run: node scripts/cert-review/prompt.mjs > "$RUNNER_TEMP/review-prompt.txt"
      - name: Claude Code (pinned, installed before any secret is in the job's steps)
        run: |
          npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version
      - name: Review
        env:
          CLAUDE_CODE_USE_BEDROCK: '1'
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ vars.CERT_BEDROCK_MODEL || 'global.anthropic.claude-opus-5-5' }}
        run: |
          set -o pipefail
          claude -p --model "$MODEL" --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
            --dangerously-skip-permissions --max-turns 300 --output-format stream-json --verbose \
            < "$RUNNER_TEMP/review-prompt.txt" > "$RUNNER_TEMP/claude-execution-output.json"
          tail -1 "$RUNNER_TEMP/claude-execution-output.json" | jq -r '"review: \(.subtype // "?") in \(.num_turns // "?") turns, \((.duration_ms // 0) / 60000 | floor) min"'
          test -s "$RUNNER_TEMP/cert-review/verdict.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cert-review-verdict-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/cert-review/verdict.json
            ${{ runner.temp }}/cert-review/comment.md
          if-no-files-found: ignore
      - name: Evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/evidence/claude-turns.json" 2> /dev/null || true
          cp -r "$RUNNER_TEMP/cert-review" "$WORK/plan" "$RUNNER_TEMP/evidence/" 2> /dev/null || true
          cp "$WORK/stage.json" "$WORK/digest.md" "$RUNNER_TEMP/evidence/" 2> /dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cert-review-evidence-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore

  record:
    name: cert-review / record
    needs: [scope, plan, bench, review]
    if: always() && needs.scope.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      verdict: ${{ steps.record.outputs.verdict }}
    env:
      N: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ needs.scope.outputs.head }}
      VERSION: ${{ needs.scope.outputs.version }}
      BEHAVIOUR: ${{ needs.scope.outputs.behaviour }}
      WHY: ${{ needs.scope.outputs.why }}
      PACKED: ${{ needs.scope.outputs.head_sha256 }}
      UPSTREAM: ${{ needs.bench.result == 'success' && needs.review.result || format('bench {0}', needs.bench.result) }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.scope.outputs.behaviour == 'true'
        continue-on-error: true
        with:
          name: cert-review-verdict-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/cert-review
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.scope.outputs.behaviour == 'true'
        continue-on-error: true
        with:
          name: cert-pack-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/pack
      - name: The line (this job's tools, main's at the pull request's base)
        id: record
        run: |
          mkdir -p "$RUNNER_TEMP/cert-review" "$RUNNER_TEMP/record"
          if [ "$BEHAVIOUR" != true ]; then
            line="$WHY"
            printf '%s\n' "$line" > "$RUNNER_TEMP/record/line.txt"
            printf '**Cert review: not needed.** %s\n\n```\n%s\n```\n' "$WHY" "$line" > "$RUNNER_TEMP/record/section.md"
            echo "verdict=not-behaviour" >> "$GITHUB_OUTPUT"
            echo "state=success" >> "$GITHUB_OUTPUT"
          else
            tgz=$(ls "$RUNNER_TEMP"/pack/pack/head/*.tgz 2> /dev/null | head -1 || true)
            if node scripts/cert-review/record.mjs --pr "$N" --head "$HEAD_SHA" --version "$VERSION" --review "$RUNNER_TEMP/cert-review" \
              --out "$RUNNER_TEMP/record" --run "$RUN_URL" --repo "$GH_REPO" --tarball "$tgz" --sha256 "$PACKED" --upstream "$UPSTREAM"; then
              echo "verdict=certified" >> "$GITHUB_OUTPUT"
              echo "state=success" >> "$GITHUB_OUTPUT"
            else
              echo "verdict=fail" >> "$GITHUB_OUTPUT"
              echo "state=failure" >> "$GITHUB_OUTPUT"
            fi
          fi
          { echo '```'; cat "$RUNNER_TEMP/record/line.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cert-review-record-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/record/
          if-no-files-found: error
      - name: The cert-review status on the head, and the sticky comment on the pull request
        env:
          STATE: ${{ steps.record.outputs.state }}
        run: |
          line=$(head -1 "$RUNNER_TEMP/record/line.txt")
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state="$STATE" -f context=cert-review -f target_url="$RUN_URL" \
            -f description="$(printf '%s' "$line" | cut -c1-140)" --jq '"status \(.state) on \(.sha)"'
          body=$(printf '<!-- cert-review -->\n%s\n' "$(cat "$RUNNER_TEMP/record/section.md")")
          id=$(gh api "repos/$GH_REPO/issues/$N/comments" --paginate --jq '.[] | select(.body | startswith("<!-- cert-review -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" --jq .html_url
          else
            gh api "repos/$GH_REPO/issues/$N/comments" -f body="$body" --jq .html_url
          fi

  merge-group:
    name: cert-review / merge group
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The group's commits (the tools stay main's, at the group's base)
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: git fetch -q origin "+$HEAD_REF:refs/remotes/group/head"
      - name: Every pull request in the group has a successful cert-review on the head that entered the queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: node scripts/cert-review/group.mjs --base "$BASE" --head "$HEAD_SHA" --repo "$GH_REPO"

  verdict:
    name: cert-review / verdict
    needs: [scope, record, merge-group]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The required check
        env:
          EVENT: ${{ github.event_name }}
          FORK: ${{ needs.scope.outputs.fork }}
          BEHAVIOUR: ${{ needs.scope.outputs.behaviour }}
          WHY: ${{ needs.scope.outputs.why }}
          VERDICT: ${{ needs.record.outputs.verdict }}
          SCOPE: ${{ needs.scope.result }}
          GROUP: ${{ needs.merge-group.result }}
        run: |
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            echo "cert-review runs on pull requests and merge groups ($EVENT)"
            exit 0
          fi
          if [ "$EVENT" = merge_group ]; then
            [ "$GROUP" = success ] || { echo "::error::a pull request in the group has no successful cert-review on the head that entered the queue"; exit 1; }
            echo "every pull request in the group is certified or not behaviour"
            exit 0
          fi
          [ "$SCOPE" = success ] || { echo "::error::cert-review could not decide the scope ($SCOPE)"; exit 1; }
          if [ "$FORK" = true ] && [ "$BEHAVIOUR" = true ]; then
            echo "::error title=fork: no cert review::a fork's pull request that changes shipped behaviour gets no review (no secrets); push the branch to this repository"
            exit 1
          fi
          if [ "$BEHAVIOUR" != true ]; then
            echo "$WHY"
            exit 0
          fi
          [ "$VERDICT" = certified ] || { echo "::error::cert-review: $VERDICT (see the record and the pull request comment)"; exit 1; }
          echo "certified"
