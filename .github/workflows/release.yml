# Certify in the PR, release simply: cert-review runs on the pull request
# (ci.yml), so only certified changes merge, and every push to main releases
# what landed. semantic-release decides the version and tags it on the bench
# pool (npmPublish off); a hosted job publishes exactly that commit with
# trusted publishing (OIDC) and provenance (npm trusts release.yml by name,
# `fledgling` in package.json); then a code-only verify checks the registry
# copy against its provenance and the tag, opens a supply-chain alert issue on
# a mismatch, and writes the release line.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=node-version depName=node versioning=node
  NODE_VERSION: '24.22.0'

jobs:
  tag:
    name: release / tag
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    concurrency:
      group: release-tag
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: head
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ] || git tag --points-at HEAD | grep -q '^v'; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "main has moved past $(git rev-parse --short HEAD); the run for the newer commit releases it" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: steps.head.outputs.current == 'true'
        run: npm ci
      - if: steps.head.outputs.current == 'true'
        id: semantic-release
        name: semantic-release decides the version, tags it and writes the GitHub release; npm publishing is the publish job's
        run: npx semantic-release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        if: steps.head.outputs.current == 'true'
        run: |
          set -euo pipefail
          tags=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tr '\n' ' ' || true)
          for tag in $tags; do
            git ls-remote --exit-code origin "refs/tags/$tag" > /dev/null || git push origin "refs/tags/$tag"
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "release tags: ${tags:-none}"
      - name: The tag job fails whenever semantic-release failed (a tag it made still publishes)
        if: steps.head.outputs.current == 'true'
        env:
          SEMANTIC_RELEASE: ${{ steps.semantic-release.outcome }}
        run: node scripts/release-outcome.mjs

  publish:
    name: release / publish
    needs: tag
    if: always() && github.ref == 'refs/heads/main' && needs.tag.outputs.tags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm publish the tagged commit, with provenance
        id: publish
        env:
          TAGS: ${{ needs.tag.outputs.tags }}
        run: |
          set -euo pipefail
          version=$(printf '%s\n' $TAGS | sed 's/^v//' | sort -V | tail -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@ai-ecoverse/slicc-jsh@$version" version > /dev/null 2>&1; then
            echo "@ai-ecoverse/slicc-jsh@$version is already on npm"
            exit 0
          fi
          head=$(git rev-parse HEAD)
          tagged=$(git rev-parse "v$version^{commit}")
          [ "$head" = "$tagged" ] || { echo "::error::refuse to publish: HEAD is $head, tag v$version is $tagged"; exit 1; }
          npm version "$version" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public --tag latest

  verify:
    name: release / verify on npm
    needs: publish
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm integrity, SLSA provenance (release.yml on main, gitCommit = gitHead = tag), signatures, on main
        id: verify
        run: |
          line=$(node scripts/cert-review/published.mjs --version "$VERSION") && ok=1 || ok=0
          { echo '```'; echo "$line"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$line"
          printf '%s\n' "$line" > "$RUNNER_TEMP/verify.txt"
          [ "$ok" = 1 ] || { echo "::error title=v$VERSION on npm::$line"; exit 1; }
      - name: A supply-chain alert issue on a mismatch
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          gh issue create --title "supply-chain alert: @ai-ecoverse/slicc-jsh@$VERSION on npm doesn't verify" \
            --body "$(printf 'The post-publish verify of v%s failed in %s:\n\n```\n%s\n```\n' "$VERSION" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$(cat "$RUNNER_TEMP/verify.txt")")"
      - name: The release line (the published tarball, re-fetched from the registry)
        run: |
          git fetch --tags --force origin
          node scripts/release-line.mjs "$VERSION"
      - name: The cert-review section (each pull request in the release, with its cert line)
        run: |
          prev=$(npm view @ai-ecoverse/slicc-jsh versions --json | jq -r '.[]' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | awk -v v="$VERSION" '$0 != v' | tail -1)
          node scripts/cert-review/carry.mjs --from "v$prev" --to "v$VERSION" --release "v$VERSION"

  alert:
    name: release / alert on failure
    needs: [tag, publish, verify]
    if: always() && github.ref == 'refs/heads/main' && (needs.tag.result == 'failure' || needs.publish.result == 'failure' || needs.verify.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TAG: ${{ needs.tag.result }}
      PUBLISH: ${{ needs.publish.result }}
      VERIFY: ${{ needs.verify.result }}
      TAGS: ${{ needs.tag.outputs.tags }}
    steps:
      - name: An issue, so the failure is seen without anyone polling
        run: |
          gh issue create --title "release of ${GITHUB_SHA:0:12} failed in run $GITHUB_RUN_ID" \
            --body "$(printf 'The release of %s failed in %s.\n\n- tag: %s (tags: %s)\n- publish: %s\n- verify: %s\n' "$GITHUB_SHA" "$RUN_URL" "$TAG" "${TAGS:-none}" "$PUBLISH" "$VERIFY")"
