# Releases with semantic-release on every push to main, like the sibling
# repos: a `feat` gives a minor, a `fix`/`perf` a patch (0.x stays 0.x until a
# breaking change), published to npm with trusted publishing (OIDC) and
# provenance, plus a GitHub release. npm trusts this workflow by name
# (`fledgling` in package.json; `npm run trust` sets it up).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Publish only from main, also when dispatched by hand from another branch.
    if: github.ref == 'refs/heads/main'
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-release.yml@v1.20.0
    with:
      # renovate: datasource=node-version depName=node versioning=node
      node-version: '24.22.0'
      test: npm test
    secrets: inherit

  # The release line for the cert lane: when the release job published (a v*
  # tag on this commit), the tarball re-fetched from the registry, its
  # gitHead, sha256, sha512 integrity and npm provenance commit checked
  # against the released commit, plus whether main contains it (onMain),
  # written into the GitHub release's body.
  release-line:
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # renovate: datasource=node-version depName=node versioning=node
          node-version: '24.22.0'
      - name: Release line
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force origin
          node scripts/release-line.mjs
