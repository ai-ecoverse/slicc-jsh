# Releases with semantic-release on every push to main, like the sibling
# repos: a `feat` gives a minor, a `fix`/`perf` a patch (0.x stays 0.x until a
# breaking change), published to npm with trusted publishing (OIDC) and
# provenance, plus a GitHub release. npm trusts this workflow by name
# (`fledgling` in package.json; `npm run trust` sets it up).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Publish only from main, also when dispatched by hand from another branch.
    if: github.ref == 'refs/heads/main'
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-release.yml@v1.20.0
    with:
      node-version: '24.21.0'
      test: npm test
    secrets: inherit
