# Certify in the PR, release simply: cert-review runs on the pull request
# (ci.yml), so only certified changes merge, and every push to main releases
# what landed. semantic-release decides the version and tags it on the bench
# pool (npmPublish off); a hosted job publishes exactly that commit with
# trusted publishing (OIDC) and provenance (npm trusts release.yml by name,
# `fledgling` in package.json), and a successful publish is the evidence:
# nothing reads the registry back afterwards (its copy lags by minutes). The
# notes job then writes the cert-review section of the GitHub release, from
# git and GitHub only.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=node-version depName=node versioning=node
  NODE_VERSION: '26.12.0'

jobs:
  tag:
    name: release / tag
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    concurrency:
      group: release-tag
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: head
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ] || git tag --points-at HEAD | grep -q '^v'; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "main has moved past $(git rev-parse --short HEAD); the run for the newer commit releases it" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: steps.head.outputs.current == 'true'
        run: npm ci
      - if: steps.head.outputs.current == 'true'
        id: semantic-release
        name: semantic-release decides the version, tags it and writes the GitHub release; npm publishing is the publish job's
        run: npx semantic-release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        if: steps.head.outputs.current == 'true'
        run: |
          set -euo pipefail
          tags=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tr '\n' ' ' || true)
          for tag in $tags; do
            git ls-remote --exit-code origin "refs/tags/$tag" > /dev/null || git push origin "refs/tags/$tag"
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "release tags: ${tags:-none}"
      - name: The tag job fails whenever semantic-release failed (a tag it made still publishes)
        if: steps.head.outputs.current == 'true'
        env:
          SEMANTIC_RELEASE: ${{ steps.semantic-release.outcome }}
        run: |
          set -euo pipefail
          node scripts/release-outcome.mjs 2>&1 | tee "$RUNNER_TEMP/outcome.out"
          grep -Eq '^semantic-release( tagged v[0-9]+\.[0-9]+\.[0-9]+(, v[0-9]+\.[0-9]+\.[0-9]+)*|: nothing to release)$' "$RUNNER_TEMP/outcome.out" || { echo "::error title=release outcome: no verdict::release-outcome.mjs exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }

  publish:
    name: release / publish
    needs: tag
    if: always() && github.ref == 'refs/heads/main' && needs.tag.outputs.tags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm publish the tagged commit, with provenance
        id: publish
        env:
          TAGS: ${{ needs.tag.outputs.tags }}
        run: |
          set -euo pipefail
          version=$(printf '%s\n' $TAGS | sed 's/^v//' | sort -V | tail -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@ai-ecoverse/slicc-jsh@$version" version > /dev/null 2>&1; then
            echo "@ai-ecoverse/slicc-jsh@$version is already on npm"
            exit 0
          fi
          head=$(git rev-parse HEAD)
          tagged=$(git rev-parse "v$version^{commit}")
          [ "$head" = "$tagged" ] || { echo "::error::refuse to publish: HEAD is $head, tag v$version is $tagged"; exit 1; }
          npm version "$version" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public --tag latest

  notes:
    name: release / release notes
    needs: publish
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The cert-review section (each pull request in the release, with its cert line)
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          prev=$(git tag --list 'v*' | sed 's/^v//' | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "$VERSION"; } | sort -uV | awk -v v="$VERSION" '$0 == v { print p; exit } { p = $0 }')
          [ -n "$prev" ] || { echo "::error title=cert-review section: no verdict::no v* tag before v$VERSION: a gate's silence is not a pass"; exit 1; }
          node scripts/cert-review/carry.mjs --from "v$prev" --to "v$VERSION" --release "v$VERSION" 2>&1 | tee "$RUNNER_TEMP/carry.out"
          grep -Eq "^wrote the cert-review section of v$VERSION \\([0-9]+ pull request\\(s\\)\\)$" "$RUNNER_TEMP/carry.out" || { echo "::error title=cert-review section: no verdict::carry.mjs exited 0 without its verdict line: a gate's silence is not a pass"; exit 1; }

  alert:
    name: release / alert on failure
    needs: [tag, publish]
    if: always() && github.ref == 'refs/heads/main' && (needs.tag.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TAG: ${{ needs.tag.result }}
      PUBLISH: ${{ needs.publish.result }}
      TAGS: ${{ needs.tag.outputs.tags }}
    steps:
      - name: An issue, so the failure is seen without anyone polling
        run: |
          gh issue create --title "release of ${GITHUB_SHA:0:12} failed in run $GITHUB_RUN_ID" \
            --body "$(printf 'The release of %s failed in %s.\n\n- tag: %s (tags: %s)\n- publish: %s\n' "$GITHUB_SHA" "$RUN_URL" "$TAG" "${TAGS:-none}" "$PUBLISH")"
